name: Run Dotnet Tests
description: Test .NET solution or project
author: devantler-tech
inputs:
  github-token:
    description: GitHub token for authenticated package restore and Code Quality upload
    required: false
    default: ""
  working-directory:
    description: Directory to run the tests in
    required: false
    default: .
runs:
  using: composite
  steps:
    - name: ⚙️ Setup .NET
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
      with:
        # Provision both the previous STS (9) and the current LTS (10) so callers can
        # target either TFM. Multiple lines install side-by-side SDKs.
        dotnet-version: |
          9
          10
    - name: 🚚 Restore packages with GitHub Packages
      if: inputs.github-token != ''
      run: |
        set -euo pipefail
        expected_source_url="https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
        # A sentinel keeps indexed arrays compatible with the Bash 3.2 shipped on macOS
        # when nounset is enabled; empty-array expansion otherwise raises an error.
        cleanup_modes=("none")
        cleanup_paths=("")
        cleanup_backups=("")
        restore_configs=("")
        needs_default_config=false

        cleanup_sources() {
          local cleanup_status=0
          local i
          for ((i = ${#cleanup_modes[@]} - 1; i >= 0; i--)); do
            case "${cleanup_modes[$i]}" in
              created)
                rm -f "${cleanup_paths[$i]}" || cleanup_status=1
                ;;
              restore)
                if cp "${cleanup_backups[$i]}" "${cleanup_paths[$i]}"; then
                  rm -f "${cleanup_backups[$i]}"
                else
                  echo "::error::Failed to restore ${cleanup_paths[$i]}; backup retained at ${cleanup_backups[$i]}"
                  cleanup_status=1
                fi
                ;;
            esac
          done
          return "$cleanup_status"
        }
        on_exit() {
          local original_status=$?
          trap - EXIT
          if cleanup_sources; then
            exit "$original_status"
          fi
          exit 1
        }
        trap on_exit EXIT

        add_restore_config() {
          local project_path="$1"
          local config_value="$2"
          local config_dir
          local existing

          config_value="${config_value//\\//}"
          if [[ "$config_value" =~ ^[[:alpha:]]:/ ]] && command -v cygpath >/dev/null 2>&1; then
            config_value="$(cygpath -u "$config_value")"
          elif [[ "$config_value" != /* ]]; then
            config_value="$(dirname "$project_path")/$config_value"
          fi
          if [[ ! -f "$config_value" ]]; then
            echo "::error::RestoreConfigFile does not exist: $config_value"
            exit 1
          fi
          config_dir="$(cd "$(dirname "$config_value")" && pwd -P)"
          config_value="$config_dir/$(basename "$config_value")"

          for existing in "${restore_configs[@]}"; do
            [[ -z "$existing" ]] && continue
            if [[ "$existing" == "$config_value" ]]; then
              return
            fi
          done
          restore_configs+=("$config_value")
        }

        inspect_project_config() {
          local project_path="$1"
          local config_value
          if [[ "$project_path" == "." ]]; then
            config_value="$(dotnet msbuild -getProperty:RestoreConfigFile)"
          else
            config_value="$(dotnet msbuild "$project_path" -getProperty:RestoreConfigFile)"
          fi
          config_value="${config_value%$'\r'}"
          if [[ -n "$config_value" ]]; then
            add_restore_config "$project_path" "$config_value"
          else
            needs_default_config=true
          fi
        }

        solution_listing=
        found_solution_project=false
        if solution_listing="$(dotnet sln list 2>/dev/null)"; then
          while IFS= read -r project_path; do
            project_path="${project_path%$'\r'}"
            case "$project_path" in
              *.csproj|*.fsproj|*.vbproj)
                found_solution_project=true
                project_path="${project_path//\\//}"
                inspect_project_config "$project_path"
                ;;
            esac
          done <<<"$solution_listing"
          if [[ "$found_solution_project" == false ]]; then
            needs_default_config=true
          fi
        else
          inspect_project_config "."
        fi

        configure_source() {
          local selected_config="${1:-}"
          local source_listing
          local github_source_url
          local config_path
          local config_backup

          if [[ -n "$selected_config" ]]; then
            source_listing="$(dotnet nuget list source --configfile "$selected_config" --format Detailed)"
          else
            source_listing="$(dotnet nuget list source --format Detailed)"
          fi
          if grep -Eiq '^[[:space:]]*[0-9]+\.[[:space:]]+github[[:space:]]+\[Enabled\]' <<<"$source_listing"; then
            github_source_url="$(
              awk '
                tolower($0) ~ /^[[:space:]]*[0-9]+\.[[:space:]]+github[[:space:]]+\[enabled\][[:space:]]*$/ {
                  getline
                  sub(/^[[:space:]]+/, "")
                  print
                  exit
                }
              ' <<<"$source_listing"
            )"
            if [[ "$github_source_url" != "$expected_source_url" ]]; then
              echo "::error::The existing NuGet source named 'github' does not target $expected_source_url"
              exit 1
            fi
          elif grep -Eiq '^[[:space:]]*[0-9]+\.[[:space:]]+github[[:space:]]+\[Disabled\]' <<<"$source_listing"; then
            echo "::error::The existing NuGet source named 'github' is disabled; enable or rename it before authenticated restore"
            exit 1
          else
            config_path="$selected_config"
            if [[ -z "$config_path" ]]; then
              config_path="$(find . -maxdepth 1 \( -type f -o -type l \) -iname 'nuget.config' -print -quit)"
            fi
            if [[ -n "$config_path" ]]; then
              config_backup="$(mktemp)"
              cp "$config_path" "$config_backup"
              chmod 600 "$config_backup"
              cleanup_modes+=("restore")
              cleanup_paths+=("$config_path")
              cleanup_backups+=("$config_backup")
              dotnet nuget add source \
                --configfile "$config_path" \
                --name github \
                "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
            else
              config_path="$PWD/NuGet.Config"
              cleanup_modes+=("created")
              cleanup_paths+=("$config_path")
              cleanup_backups+=("")
              umask 077
              printf '%s\n' \
                '<?xml version="1.0" encoding="utf-8"?>' \
                '<configuration>' \
                '  <packageSources>' \
                '    <add key="github" value="https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" />' \
                '  </packageSources>' \
                '</configuration>' \
                >"$config_path"
            fi
          fi
        }

        for restore_config in "${restore_configs[@]}"; do
          [[ -z "$restore_config" ]] && continue
          configure_source "$restore_config"
        done
        if [[ "$needs_default_config" == true ]]; then
          configure_source
        fi

        dotnet restore
        trap - EXIT
        cleanup_sources
      env:
        # NuGet reads source credentials from this process-only environment variable, so the
        # token is neither written to NuGet.Config nor exposed to repository-controlled tests.
        NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ inputs.github-token }};ValidAuthenticationTypes=Basic
      shell: bash
      working-directory: ${{ inputs.working-directory }}
    - name: 🚚 Restore packages without credentials
      if: inputs.github-token == ''
      run: dotnet restore
      shell: bash
      working-directory: ${{ inputs.working-directory }}
    # The .NET 10 SDK refuses the VSTest bridge for a project that opts into
    # Microsoft.Testing.Platform in global.json, and that platform rejects VSTest's
    # --collect/--logger flags. Pick the command from the runner the SDK will use: the
    # nearest global.json, found the way the SDK finds it (walking up from here).
    - name: 🧪 Test
      run: |
        set -euo pipefail
        runner=vstest
        dir="$PWD"
        while :; do
          if [[ -f "$dir/global.json" ]]; then
            # Parse it as JSON so formatting cannot hide the setting. The SDK also accepts
            # comments, which jq rejects; for such a file, match the flattened text instead.
            if configured="$(jq -r '.test.runner // empty' "$dir/global.json" 2>/dev/null)"; then
              [[ "$configured" == "Microsoft.Testing.Platform" ]] && runner=microsoft-testing-platform
            elif tr -d '\r\n' <"$dir/global.json" |
              grep -Eq '"runner"[[:space:]]*:[[:space:]]*"Microsoft\.Testing\.Platform"'; then
              runner=microsoft-testing-platform
            fi
            break
          fi
          parent="$(dirname "$dir")"
          [[ "$parent" == "$dir" ]] && break
          dir="$parent"
        done

        if [[ "$runner" == vstest ]]; then
          dotnet test --no-restore --collect:"XPlat Code Coverage" --logger "console;verbosity=detailed"
        elif grep -rqs --include='*.csproj' --include='*.fsproj' --include='*.vbproj' --include='*.props' --include='*.targets' \
          'Microsoft.Testing.Extensions.CodeCoverage' .; then
          # Each test project writes its own uniquely named <guid>.cobertura.xml.
          dotnet test --no-restore --coverage --coverage-output-format cobertura
        else
          echo "::notice::Microsoft.Testing.Platform project without Microsoft.Testing.Extensions.CodeCoverage — running tests without coverage. Reference the extension to collect coverage."
          dotnet test --no-restore
        fi
      shell: bash
      working-directory: ${{ inputs.working-directory }}
    # GitHub Code Quality accepts a single Cobertura report, so merge the per-project files.
    # Linux only — one upload per repo avoids the matrix triple-reporting the same coverage.
    # best-effort: this is a preview feature, so it must never break .NET CI.
    # The glob matches both Coverlet's coverage.cobertura.xml and the testing platform's
    # <guid>.cobertura.xml.
    - name: 🔀 Merge coverage into a single Cobertura report
      if: runner.os == 'Linux'
      continue-on-error: true
      run: |
        dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.10
        export PATH="$PATH:$HOME/.dotnet/tools"
        reportgenerator -reports:'**/*.cobertura.xml' -targetdir:coverage-merged -reporttypes:Cobertura
      shell: bash
      working-directory: ${{ inputs.working-directory }}
    # Inlines the sibling upload-coverage wrapper (one pinned step): a composite action cannot
    # self-reference its own repo at the same commit (`uses:` takes no expressions, and
    # github.action_* is unreliable when this action is invoked via a local path), so calling
    # the third-party action directly is the only zero-lag option. Keep the inputs in sync
    # with upload-coverage/action.yaml.
    - name: 📊 Upload Code Coverage to GitHub Code Quality
      if: runner.os == 'Linux' && inputs.github-token != ''
      continue-on-error: true
      uses: actions/upload-code-coverage@b51da2c3c1b23e04d2d6477cfc34350b1f5cd3e9 # v1.2.0
      with:
        file: ${{ inputs.working-directory }}/coverage-merged/Cobertura.xml
        language: C#
        label: code-coverage/dotnet
        # best-effort during the Code Quality preview — never break .NET CI on upload hiccups.
        fail-on-error: "false"
        token: ${{ inputs.github-token }}
