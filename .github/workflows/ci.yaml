  test-suite-default-branch-coverage:
    if: "${{ github.event_name != 'merge_group' && !startsWith(github.head_ref, 'release-please--') && !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    name: "[Test] Go Suite - Default-Branch Trigger Coverage"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧪 Assert the Go test suite runs on the default branch behind its opt-in
        run: bash .github/tests/test-suite-default-branch-coverage.sh

  # ── Failing-input counterpart to the job above (the both-tests convention) ──
  # Generates its fixtures from the real workflow, so they cannot drift from it, and
  # asserts the guard fails WITH THE EXPECTED MESSAGE on each — plus that it still passes
  # the real workflow and a reflowed-but-equivalent gate, so neither an accept-everything
  # nor a reject-everything guard passes.
  test-suite-default-branch-coverage-blocks:
    if: "${{ github.event_name != 'merge_group' && !startsWith(github.head_ref, 'release-please--') && !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    name: "[Test] Go Suite Trigger Guard - Blocks On Bad Input"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧪 Assert the trigger guard blocks every bad-input fixture
        run: bash .github/tests/test-suite-default-branch-coverage-blocks.sh

  # ── Zizmor gate failure-mode self-test (generalizes the govulncheck guard; #313) ──
  # scan-for-workflow-vulnerabilities.yaml is a SECURITY GATE: its job is to FAIL a PR
  # when a workflow has a finding. The happy-path test-zizmor job only proves the gate
  # runs *clean* on this repo's own (clean) workflows — it can NOT prove the gate still
  # BITES. This job points the SAME zizmor-action the gate uses at a deliberately-
  # vulnerable fixture and asserts the scan FAILS and reports the finding, turning "the
  # gate silently stopped blocking" into a red test (the exact #282/#283 failure mode,
  # mirroring test-govulncheck-strict-blocks).
  # The fixture (.github/tests/zizmor-fixture/template-injection.yml) lives OUTSIDE
  # .github/workflows/ so zizmor's repo-wide canonical discovery — the real gate and the
  # test-zizmor self-test — never sees it; only this job, pointing zizmor at the exact
  # path, audits it. Keep the action SHA in lockstep with the gate
  # (enforced by test-zizmor-action-lockstep).
  test-zizmor-blocks:
    if: "${{ github.event_name != 'merge_group' && !startsWith(github.head_ref, 'release-please--') && !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    name: "[Test] Zizmor - Blocks On Vulnerable Fixture"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same action SHA as scan-for-workflow-vulnerabilities.yaml, pointed at the
      # fixture. advanced-security:false keeps the fixture's deliberate finding OUT of
      # the Security tab (and needs no security-events permission); continue-on-error
      # lets the run proceed so the next step can assert the failure. The action tees
      # zizmor's output to "${RUNNER_TEMP}/zizmor" regardless of format, which the
      # assertion reads to confirm the finding was actually reported — distinguishing a
      # real block from an operational error (e.g. image pull) that would otherwise make
      # a bare "the step failed" check pass for the wrong reason.
      - name: 🌈 Scan vulnerable fixture (expected to fail)
        id: scan
        continue-on-error: true
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          inputs: .github/tests/zizmor-fixture/template-injection.yml
          advanced-security: false
          annotations: false
          color: false

      - name: ✅ Assert the gate blocked on the vulnerable fixture
        shell: bash
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::Zizmor scan of the deliberately-vulnerable fixture should FAIL, but its outcome was '$OUTCOME'. The scan-for-workflow-vulnerabilities gate is no longer blocking workflow findings."
            exit 1
          fi
          report="${RUNNER_TEMP}/zizmor"
          if ! grep -q "template-injection" "$report" 2>/dev/null; then
            echo "::error::Zizmor scan failed, but its output did not report the expected template-injection finding — the failure was operational (e.g. image pull), not a real workflow-vulnerability block. Output:"
            cat "$report" 2>/dev/null || echo "(no output captured)"
            exit 1
          fi
          echo "Zizmor gate correctly blocked on the vulnerable fixture ✅"

  test-zizmor-action-lockstep:
    if: "${{ github.event_name != 'merge_group' && !startsWith(github.head_ref, 'release-please--') && !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    name: "[Test] Zizmor - Gate Pins Self-Tested Action"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `uses:` cannot be parametrized, so test-zizmor-blocks hard-codes the zizmor-action
      # SHA. This guard asserts the gate pins that SAME SHA, so the self-test always
      # exercises the real gate. If the gate's action is bumped without updating the
      # self-test, this check goes red and forces both to move in lockstep.
      - name: 🔒 Assert the gate pins the self-tested zizmor-action SHA
        shell: bash
        env:
          # Match the full `uses:` line, not the bare ref — the ref also appears in
          # comments, so a bare-ref grep could false-pass if the real `uses:` SHA changed
          # while a comment still mentioned the old ref.
          EXPECTED: "uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054"
        run: |
          set -euo pipefail
          if ! grep -qF "$EXPECTED" .github/workflows/scan-for-workflow-vulnerabilities.yaml; then
            echo "::error::scan-for-workflow-vulnerabilities.yaml no longer pins '$EXPECTED'. If the zizmor action was changed intentionally, update test-zizmor-blocks and this EXPECTED value so the failure-mode self-test keeps exercising the real gate."
            exit 1
          fi
          echo "scan-for-workflow-vulnerabilities.yaml pins the self-tested zizmor action ✅"

  # ── validate-go-project quality-gate failure-mode self-tests (#316) ───────────
  # The govulncheck/zizmor guards above prove the security-scan gates fail closed;
  # these extend the same pattern to validate-go-project.yaml's remaining quality
  # gates — golangci-lint and `go test`. Each runs the gate's real tool against a
  # deliberately-broken fixture under continue-on-error and asserts it FAILED on a
  # real finding (not an operational error such as a failed tool install), turning
  # "the gate silently stopped blocking" into a red check. test-validate-go-gate-lockstep
  # keeps the tool pins hard-coded here in step with the gate.
  test-validate-go-lint-blocks:
    if: "${{ github.event_name != 'merge_group' && !startsWith(github.head_ref, 'release-please--') && !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    name: "[Test] Validate Go Project - Lint Gate Blocks"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .github/tests/golangci-lint-fixture/go.mod

      # Mirror validate-go-project.yaml's lint step (same action SHA + version + --fix
      # args). The fixture has a deliberate, NON-auto-fixable errcheck violation, so
      # golangci-lint exits non-zero — exactly the gate's "lint fails the build" block
      # path. --output.text.path captures the findings so the next step can confirm a
      # real lint block rather than an operational failure. Keep this `uses:` + version
      # in lockstep with the gate (enforced by test-validate-go-gate-lockstep).
      - name: 🧹 Lint broken fixture (expected to fail)
        id: lint
        continue-on-error: true
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          args: --fix --output.text.path=golangci-report.txt
          working-directory: .github/tests/golangci-lint-fixture
          verify: false

      - name: ✅ Assert the lint gate blocked on the violation
        shell: bash
        env:
          OUTCOME: ${{ steps.lint.outcome }}
        run: |
          set -euo pipefail
          REPORT=.github/tests/golangci-lint-fixture/golangci-report.txt
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::golangci-lint should FAIL on the deliberate errcheck violation in .github/tests/golangci-lint-fixture, but its outcome was '$OUTCOME'. validate-go-project.yaml's lint gate is no longer blocking on lint violations."
            exit 1
          fi
          if ! grep -q "errcheck" "$REPORT" 2>/dev/null; then
            echo "::error::golangci-lint failed, but its report did not contain the expected errcheck finding — the failure was operational (e.g. a failed tool install), not a real lint block. Report:"
            cat "$REPORT" 2>/dev/null || echo "(no report captured)"
            exit 1
          fi
          echo "Lint gate correctly blocked on the errcheck violation ✅"

  test-validate-go-test-blocks:
    if: "${{ github.event_name != 'merge_group' && !startsWith(github.head_ref, 'release-please--') && !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    name: "[Test] Validate Go Project - Test Gate Blocks"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .github/tests/go-test-fixture/go.mod

      # Mirror validate-go-project.yaml's test step (`go test ./...`) against a fixture
      # whose only test fails on purpose, so the run exits non-zero — exactly the gate's
      # "a failing test fails the build" block path. The output is captured so the next
      # step can confirm a real test failure rather than a build/operational error. The
      # command is kept in lockstep with the gate by test-validate-go-gate-lockstep.
      - name: 🧪 Test broken fixture (expected to fail)
        id: gotest
        continue-on-error: true
        working-directory: .github/tests/go-test-fixture
        shell: bash
        run: |
          set -uo pipefail
          go test ./... 2>&1 | tee go-test-output.txt
          exit "${PIPESTATUS[0]}"

      - name: ✅ Assert the test gate blocked on the failing test
        shell: bash
        env:
          OUTCOME: ${{ steps.gotest.outcome }}
        run: |
          set -euo pipefail
          OUT=.github/tests/go-test-fixture/go-test-output.txt
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::go test should FAIL on the deliberately failing test in .github/tests/go-test-fixture, but its outcome was '$OUTCOME'. validate-go-project.yaml's test gate is no longer blocking on failing tests."
            exit 1
          fi
          if ! grep -q "^--- FAIL: TestDeliberatelyFails" "$OUT" 2>/dev/null; then
            echo "::error::go test failed, but its output did not show '--- FAIL: TestDeliberatelyFails' — the failure was operational (e.g. a build error), not a real test failure. Output:"
            cat "$OUT" 2>/dev/null || echo "(no output captured)"
            exit 1
          fi
          echo "Test gate correctly blocked on the failing test ✅"

  test-validate-go-gate-lockstep:
    if: "${{ github.event_name != 'merge_group' && !startsWith(github.head_ref, 'release-please--') && !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    name: "[Test] Validate Go Project - Gate Lockstep"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The two jobs above hard-code the lint action SHA + version and the `go test`
      # command. This guard asserts validate-go-project.yaml still pins the SAME ones, so
      # the self-tests always exercise the real gate. If a gate is changed without
      # updating the self-test, this check goes red and forces them to move in lockstep.
      - name: 🔒 Assert the gate pins the self-tested lint action + test command
        shell: bash
        env:
          GATE: .github/workflows/validate-go-project.yaml
          # Match full lines, not bare refs — refs/commands also appear in comments, so a
          # looser grep could false-pass if the real value changed while a comment did not.
          EXPECTED_LINT_ACTION: "uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a"
          EXPECTED_LINT_VERSION: "version: v2.11.4"
          EXPECTED_TEST_CMD: "go test ./..."
        run: |
          set -euo pipefail
          status=0
          for expected in "$EXPECTED_LINT_ACTION" "$EXPECTED_LINT_VERSION" "$EXPECTED_TEST_CMD"; do
            if ! grep -qF "$expected" "$GATE"; then
              echo "::error::$GATE no longer contains '$expected'. If the lint action/version or test command changed intentionally, update test-validate-go-lint-blocks / test-validate-go-test-blocks and these EXPECTED values so the self-tests keep exercising the real gate."
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            exit 1
          fi
          echo "validate-go-project.yaml pins the self-tested lint action + test command ✅"

  test-validate-go-project-concurrency-key:
    if: "${{ github.event_name != 'merge_group' && !startsWith(github.head_ref, 'release-please--') && !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    name: "[Test] Validate Go Project - Invocation-Aware Concurrency Key"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Two invocations of validate-go-project.yaml that differ in any way must land in
      # different concurrency groups, or the later cancels the earlier and CI - Required
      # Checks fails nondeterministically. Both collisions below were observed live, and
      # each needs its own discriminator:
      #
      #   * github.workflow — the org-required direct run vs this repo's ci.yaml
      #     self-test, which run on the same repository + ref. A reusable workflow
      #     inherits the CALLER's github.workflow (devantler-tech/actions#587).
      #   * the invocation's inputs — two calls from the SAME caller on the same ref,
      #     which github.workflow cannot tell apart. The `scan-default-branch`
      #     both-states self-tests are exactly that: identical but for one input.
      #
      # This guard goes red if either discriminator is dropped. The grep is a regex (not
      # -F) so the group's own ${{ … }} expressions are matched as literals here rather
      # than being evaluated in this workflow.
      - name: 🔒 Assert the concurrency group is invocation-aware
        shell: bash
        env:
          GATE: .github/workflows/validate-go-project.yaml
        run: |
          set -euo pipefail
          group="$(grep -E 'group: "validate-go-project-' "$GATE" || true)"
          if [[ -z "$group" ]]; then
            echo "::error::$GATE has no recognisable validate-go-project concurrency group to verify."
            exit 1
          fi
          if ! grep -Eq 'github\.workflow' <<<"$group"; then
            echo "::error::$GATE concurrency group no longer keys on github.workflow (devantler-tech/actions#587), so the org-required direct run and the ci.yaml reusable-workflow self-test share a group and cancel each other."
            exit 1
          fi
          # Every workflow_call input must appear, so a new input that distinguishes two
          # invocations cannot be added without also distinguishing their groups.
          missing=""
          while IFS= read -r input; do
            [[ -n "$input" ]] || continue
            grep -qF "inputs.$input" <<<"$group" || missing="$missing $input"
          done < <(yq -r '.["on"].workflow_call.inputs | keys | .[]' "$GATE")
          if [[ -n "$missing" ]]; then
            echo "::error::$GATE concurrency group omits workflow_call input(s):$missing. Two calls from the same caller workflow on the same ref that differ only by an input would share a group, and the later would cancel the earlier."
            exit 1
          fi
          echo "validate-go-project.yaml concurrency group is invocation-aware ✅"

  # ── lint.yaml self-tests ─────────────────────────────────────────────────────
  # lint.yaml is a GATING reusable workflow (it fails a PR on a lint finding), so per the
  # AGENTS.md convention it carries BOTH a passes-on-good-input and a blocks-on-bad-input
  # self-test — a happy-path test alone cannot catch a gate that silently stopped biting.
  # apply-fixes is false here: the self-test must never commit to the branch under test.
  test-lint-workflow:
    if: "${{ github.event_name != 'merge_group' && !startsWith(github.head_ref, 'release-please--') && !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    name: "[Test] Lint - Passes On Clean Fixture"
    # This is the real read-only consumer proof: GitHub rejects a called workflow at
    # startup if any job tries to elevate beyond these caller permissions.
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yaml
    with:
      working-directory: .github/tests/megalinter-clean-fixture
      apply-fixes: false

  test-lint-blocks:
    if: "${{ github.event_name != 'merge_group' && !startsWith(github.head_ref, 'release-please--') && !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    name: "[Test] Lint - Blocks On Invalid Fixture"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same MegaLinter image SHA as lint.yaml's gate (guarded by test-lint-gate-lockstep),
      # pointed at a fixture whose JSON has a syntax error no formatter can auto-fix — so
      # APPLY_FIXES cannot mask it and the run must exit non-zero. continue-on-error lets
      # the next step assert the failure. Reports go to a dedicated folder the assertion
      # reads, which distinguishes a real lint block from an operational failure (e.g. an
      # image pull error), which would leave no report at all.
      - name: 🧹 Lint invalid fixture (expected to fail)
        id: ml
        continue-on-error: true
        uses: oxsecurity/megalinter/flavors/go@15e5b45552097e318c93de385779ce3b1084052c # v10.0.0
        env:
          DEFAULT_WORKSPACE: .github/tests/megalinter-bad-fixture
          REPORT_OUTPUT_FOLDER: ${{ github.workspace }}/megalinter-bad-fixture-reports
          VALIDATE_ALL_CODEBASE: true
          APPLY_FIXES: none
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ Assert the lint gate blocked on the invalid fixture
        shell: bash
        env:
          OUTCOME: ${{ steps.ml.outcome }}
        run: |
          set -euo pipefail
          REPORTS="${GITHUB_WORKSPACE}/megalinter-bad-fixture-reports"
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::MegaLinter should FAIL on the deliberately-invalid JSON in .github/tests/megalinter-bad-fixture, but its outcome was '$OUTCOME'. lint.yaml's gate is no longer blocking on lint findings."
            exit 1
          fi
          if ! grep -rqF "bad.json" "$REPORTS" 2>/dev/null; then
            echo "::error::MegaLinter failed, but no report named the bad.json fixture — the failure was operational (e.g. an image pull error), not a real lint block. Reports:"
            ls -R "$REPORTS" 2>/dev/null || echo "(no reports captured)"
            exit 1
          fi
          echo "Lint gate correctly blocked on the invalid JSON fixture ✅"

  test-lint-gate-lockstep:
    if: "${{ github.event_name != 'merge_group' && !startsWith(github.head_ref, 'release-please--') && !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    name: "[Test] Lint - Gate Pins Self-Tested Image"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔐 Assert the lint credential boundary
        shell: bash
        run: bash .github/tests/test-lint-credential-boundary.sh

      # The apply-fixes job writes to contributors' branches, so its commits must be signed
      # — which is only possible through the commit API. The workflow proves that at runtime
      # on the commit it just made; this is the static half, so a reshape back to a CLI
      # commit fails here rather than silently resuming unsigned writes.
      - name: 🔏 Assert applied linter fixes are committed through the signing API
        shell: bash
        run: bash .github/tests/test-lint-signed-commit.sh

      # validate-go-project.yaml is the ORG-REQUIRED workflow: it runs on every Go pull request
      # in the organisation and carries three fixer lanes (tidy, golangci-lint, MegaLinter), so
      # it writes far more automation commits than lint.yaml does. The assertion is file-scoped,
      # which is what makes it meaningful here — one lane left on a CLI commit would keep
      # unsigned commits on the branch and hold #142's option open on its own.
      - name: 🔏 Assert the org-required Go pipeline commits fixes through the signing API
        shell: bash
        run: bash .github/tests/test-lint-signed-commit.sh .github/workflows/validate-go-project.yaml

      - name: 🔐 Assert the org-required Go pipeline applies signed fixes safely
        shell: bash
        run: bash .github/tests/test-validate-go-signed-fixes-contract.sh

      # A workflow_call input's default is applied only on the workflow_call path.
      # validate-go-project.yaml is also the org-required workflow, reached directly from
      # pull_request, where `inputs` is empty — so a default:true input read as a bare truthy
      # gate is false there, and every self-test here (which does use workflow_call) stays green
      # while the guarded behaviour is off for every consumer.
      - name: 🎚️ Assert multi-trigger input gates cannot silently evaluate false
        shell: bash
        run: bash .github/tests/test-multi-trigger-input-gate-polarity.sh

      # The commit API can inherit a file mode from the base tree but cannot set one. Measured:
      # modifying a path already at 100755 keeps it; adding a NEW executable file lands at
      # 100644. Rejecting every executable file instead of only the inexpressible change would
      # fail the job for the common case — a formatter rewriting an existing `.sh`, of which
      # platform has 66 and ksail 48 — so the boundary is pinned against real git fixtures.
      - name: 🔐 Assert the applied-fixes mode guard matches what the commit API can express
        shell: bash
        run: bash .github/tests/test-apply-signed-fixes-mode-guard.sh

      # `uses:` cannot be parametrized, so test-lint-blocks hard-codes the MegaLinter image
      # SHA. This guard asserts lint.yaml pins that SAME SHA — and that validate-go-project
      # .yaml, the org's other MegaLinter consumer, has not drifted onto a different image.
      # If any of the three is bumped alone, this goes red and forces them to move together.
      - name: 🔒 Assert both gates pin the self-tested MegaLinter image
        shell: bash
        env:
          # Match the full `uses:` line, not the bare SHA — the SHA also appears in
          # comments, so a bare grep could false-pass if the real `uses:` changed while a
          # comment still named the old one.
          EXPECTED: "uses: oxsecurity/megalinter/flavors/go@15e5b45552097e318c93de385779ce3b1084052c"
        run: |
          set -euo pipefail
          status=0
          for gate in .github/workflows/lint.yaml .github/workflows/validate-go-project.yaml; do
            if ! grep -qF "$EXPECTED" "$gate"; then
              echo "::error::$gate no longer pins '$EXPECTED'. If the MegaLinter image was bumped intentionally, update test-lint-blocks, both gates and this EXPECTED value together so the failure-mode self-test keeps exercising the real gate."
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            exit 1
          fi
          echo "Both MegaLinter gates pin the self-tested image ✅"

  # ── apply-signed-fixes.yaml self-test ────────────────────────────────────────
  # A passes-on-good-input test is genuinely impractical here: this workflow's only good
  # input is a real commit on the branch under test, and a self-test must never commit to
  # it. Per the AGENTS.md convention that gap is recorded rather than covered by a fragile
  # test — the signing path is asserted statically by test-lint-signed-commit.sh and proven
  # at runtime by the workflow's own verify_signed, which fails the job when the commit it
  # just created does not report verified=true.
  #
  # The gates that stop it committing where it must not are asserted statically instead, by
  # test-lint-signed-commit.sh, whose assertions are each proven by ablation. So this job is
  # the consumer-contract proof rather than a behavioural one: it is called the way a real
  # caller calls it, with a dependency-bot pr-owner it must refuse, which exercises the input
  # contract and -- as with test-lint-workflow -- the permission contract, since GitHub
  # rejects a called workflow at startup if any of its jobs elevates beyond these caller
  # permissions. The call commits nothing by construction as well as by gate: no patch
  # artifact exists and no App key is passed.
  test-apply-signed-fixes-suppresses-bots:
    if: "${{ github.event_name != 'merge_group' && !startsWith(github.head_ref, 'release-please--') && !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    name: "[Test] Apply Signed Fixes - Refuses A Dependency-Bot Branch"
    permissions:
      contents: read
    uses: ./.github/workflows/apply-signed-fixes.yaml
    with:
      pr-owner: "dependabot[bot]"
      commit-message: "chore: apply-signed-fixes self-test sentinel, never commit this"

