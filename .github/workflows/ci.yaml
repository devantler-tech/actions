name: 🧪 CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: "ci-${{ github.event.number || github.sha }}"
  cancel-in-progress: true

jobs:
  # Every test job below is ineligible for merge_group through a leading event
  # predicate: an explicit exclusion, or the push-only Zizmor self-test. Merge refs contain
  # PR-controlled local actions and fixtures, so test jobs must never run them with
  # repository secrets or write-capable tokens. Only `CI - Required Checks` completes
  # the merge-queue requirement; it receives no repository secrets, has no token
  # permissions, and aggregates the results inline without checking out candidate code.
  #
  # The suite is also skipped for a release-please
  # release commit — BOTH the release-please PR (head branch `release-please--*`) AND
  # the push of the squashed release commit to `main` (`chore(main): release …`, where
  # `github.head_ref` is empty so the branch-name check alone misses it). Those commits
  # only bump versions + the changelog — already tested in the PRs that introduced each
  # change — so there is nothing new to test. The `CI - Required Checks` gate still
  # runs (the inline gate treats skipped as success), keeping the required status
  # check green so the release auto-merges.
  # ── approve-pr ──────────────────────────────────────────────
  test-approve-pr:
    if: "${{ github.event_name != 'merge_group' && !startsWith(github.head_ref, 'release-please--') && !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧪 Run approve-pr
        uses: ./approve-pr
        with:
          pr-number: ${{ github.event.pull_request.number || 0 }}
          dry-run: "true"

  test-approve-pr-credential-boundary:
    if: "${{ github.event_name != 'merge_group' && !startsWith(github.head_ref, 'release-please--') && !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    name: "[Test] Approve PR - Credential-Free CI"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔒 Assert approve-pr CI stays credential-free
        run: bash .github/tests/test-approve-pr-credential-boundary.sh

  # ── cleanup-ghcr-packages ───────────────────────────────────
  test-cleanup-ghcr-packages:
    if: "${{ github.event_name != 'merge_group' && !startsWith(github.head_ref, 'release-please--') && !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Dry run against a stable, long-lived package so the test exercises the
      # action's wiring without ever deleting anything.
      - name: 🧪 Run cleanup-ghcr-packages (dry run)
        uses: ./cleanup-ghcr-packages
        with:
          package: pandoc-plus
          dry-run: "true"

  # ── create-issues-from-todos ────────────────────────────────
  test-create-issues-from-todos:
    if: "${{ github.event_name != 'merge_group' && !startsWith(github.head_ref, 'release-please--') && !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔒 Assert TODO action retries locally
        shell: bash
        run: |
          action_file="$GITHUB_WORKSPACE/create-issues-from-todos/action.yaml"
          if grep -Eq '^[[:space:]]*-[[:space:]]*uses:[[:space:]]*Wandalen/wretry\.action@' "$action_file"; then
            echo "::error::create-issues-from-todos must not depend on the external retry wrapper; it expands to an unpinned nested action ref in consumers with full-SHA policies."
            exit 1
          fi
          grep -qF ".scripts/retry.sh" "$action_file" || {
            echo "::error::create-issues-from-todos must use the bundled retry helper."
            exit 1
          }
          grep -qF "retry_helper=\"\${RUNNER_TEMP}/devantler-actions-retry.sh\"" "$action_file" || {
            echo "::error::create-issues-from-todos must preserve retry.sh outside the action checkout."
            exit 1
          }
          grep -qF "retry() { bash \"\${RUNNER_TEMP}/devantler-actions-retry.sh\" \"\$@\"; }" "$action_file" || {
            echo "::error::create-issues-from-todos must invoke the preserved retry helper."
            exit 1
          }
          grep -qF "ghcr.io/alstr/todo-to-issue-action:v5.1.15" "$action_file" || {
            echo "::error::create-issues-from-todos must keep the pinned todo-to-issue container image floor."
            exit 1
          }
          # The image runs with github.token and the App PROJECTS_SECRET, so a mutable
          # tag would let an upstream retag execute unreviewed code with those
          # credentials. Require an immutable digest (devantler-tech/actions#942).
          grep -Eq 'TODO_TO_ISSUE_IMAGE:[[:space:]]*ghcr\.io/alstr/todo-to-issue-action:v[0-9]+\.[0-9]+\.[0-9]+@sha256:[0-9a-f]{64}$' "$action_file" || {
            echo "::error::create-issues-from-todos must pin the todo-to-issue image to an immutable @sha256 digest, not a bare tag."
            exit 1
          }

      - name: 🧪 Run create-issues-from-todos
        uses: ./create-issues-from-todos
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          project: organization/devantler-tech/5

  # ── dependency-review ───────────────────────────────────────
  test-dependency-review:
    runs-on: ubuntu-latest
    # The underlying action only produces a diff on pull_request events; on push /
    # merge_group there is no PR to review, so the test is PR-gated (skipped
    # otherwise, which the inline required-check collector tolerates — like
    # test-approve-pr).
    if: "${{ github.event_name != 'merge_group' && !startsWith(github.head_ref, 'release-please--') && !startsWith(github.event.head_commit.message, 'chore(main): release ') && startsWith(github.event_name, 'pull_request') }}"
    permissions:
      contents: read
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # warn-only defaults to true, so this exercises the action's wiring on the
      # real PR diff without ever failing CI on a finding in this repo's own deps.
      - name: 🧪 Run dependency-review
        id: review
        uses: ./dependency-review

      - name: ✅ Verify the review ran and produced outputs
        shell: bash
        env:
          CHANGES: ${{ steps.review.outputs.dependency-changes }}
        run: |
          # dependency-changes is always emitted (JSON, "[]" when nothing changed);
          # an empty value means the action never ran / its wiring is broken.
          if [[ -z "$CHANGES" ]]; then
            echo "::error::dependency-changes output is empty — the action did not run"
            exit 1
          fi
          echo "Dependency review ran; dependency-changes=${CHANGES}"

  # ── diagnose-flux ───────────────────────────────────────────
  test-diagnose-flux:
    if: "${{ github.event_name != 'merge_group' && !startsWith(github.head_ref, 'release-please--') && !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Put the committed fake kubectl on PATH so the composite runs hermetically
      # (no real cluster). Its REAL jq failing-pod selection then runs against the
      # fixture pod list, so a regression in that logic fails this test.
      - name: 🔧 Put fake kubectl on PATH
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.github/tests/diagnose-flux/bin" >> "$GITHUB_PATH"

      - name: 🧪 Run diagnose-flux against the fake cluster
        uses: ./diagnose-flux

      - name: ✅ Assert crash + Job pods were dumped, healthy was not
        shell: bash
        run: |
          logged="$RUNNER_TEMP/logged-pods.txt"
          if [[ ! -f "$logged" ]]; then
            echo "::error::diagnose-flux dumped no pod logs — the jq failing-pod selection is broken"
            exit 1
          fi
          for want in crasher jobpod; do
            if ! grep -qx "$want" "$logged"; then
              echo "::error::expected pod '$want' to be dumped but it was not"; cat "$logged"; exit 1
            fi
          done
          if grep -qx healthy "$logged"; then
            echo "::error::healthy pod was dumped — the failing-pod selection is too broad"; cat "$logged"; exit 1
          fi
          echo "diagnose-flux dumped crasher + jobpod and skipped healthy — OK"
  # ── enable-auto-merge-on-pr ─────────────────────────────────
  test-enable-auto-merge-on-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: >-
      github.event_name != 'merge_group' &&
      !startsWith(github.head_ref, 'release-please--') &&
      !startsWith(github.event.head_commit.message, 'chore(main): release ') &&
      startsWith(github.event_name, 'pull_request') &&
      (
        github.event.pull_request.user.login == 'dependabot[bot]' ||
        github.event.pull_request.user.login == 'renovate[bot]' ||
        github.event.pull_request.user.login == 'botantler[bot]' ||
        github.event.pull_request.user.login == 'devantler'
      )
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧪 Run enable-auto-merge-on-pr
        uses: ./enable-auto-merge-on-pr
        with:
          pr-number: ${{ github.event.pull_request.number }}
          dry-run: "true"

  test-enable-auto-merge-on-pr-credential-boundary:
    if: "${{ github.event_name != 'merge_group' && !startsWith(github.head_ref, 'release-please--') && !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    name: "[Test] Enable Auto-Merge on PR - Credential-Free CI"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔒 Assert enable-auto-merge-on-pr CI stays credential-free
        run: bash .github/tests/test-enable-auto-merge-on-pr-credential-boundary.sh

  # ── free-disk-space ─────────────────────────────────────────
  test-free-disk-space:
    if: "${{ github.event_name != 'merge_group' && !startsWith(github.head_ref, 'release-please--') && !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧪 Run free-disk-space
        id: disk
        uses: ./free-disk-space

      - name: ✅ Verify space was reclaimed
        shell: bash
        env:
          FREED: ${{ steps.disk.outputs.freed }}
          AVAILABLE: ${{ steps.disk.outputs.available }}
        run: |
          if [[ -z "$FREED" || -z "$AVAILABLE" ]]; then
            echo "::error::freed/available outputs are empty"
            exit 1
          fi
          # The default set removes ~11+ GB of toolchains; require a real gain so
          # a silently no-op'd reclaim (e.g. paths moved on a new runner image)
          # is caught rather than passing vacuously.
          if (( FREED < 1 )); then
            echo "::error::expected to reclaim >=1G, got ${FREED}G"
            exit 1
          fi
          echo "Reclaimed ${FREED}G; ${AVAILABLE}G free."

  # ── free-disk-space (all categories disabled → clean no-op) ──
  test-free-disk-space-keep:
    if: "${{ github.event_name != 'merge_group' && !startsWith(github.head_ref, 'release-please--') && !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Disabling every category must be a clean no-op (0 G reclaimed), not an
      # error — exercises the "empty path list" branch and the false toggles.
      - name: 🧪 Run free-disk-space with all categories disabled
        id: disk
        uses: ./free-disk-space
        with:
          android: "false"
          dotnet: "false"
          haskell: "false"
          boost: "false"
          swift: "false"
          codeql: "false"
          pypy: "false"
          powershell: "false"
          miniconda: "false"

      - name: ✅ Verify no-op succeeded with outputs
        shell: bash
        env:
          FREED: ${{ steps.disk.outputs.freed }}
          AVAILABLE: ${{ steps.disk.outputs.available }}
        run: |
          if [[ -z "$FREED" || -z "$AVAILABLE" ]]; then
            echo "::error::freed/available outputs are empty"
            exit 1
          fi
          # Disabling every category removes nothing, so the reclaim MUST be 0 —
          # any non-zero value means the action deleted something it shouldn't.
          if (( FREED != 0 )); then
            echo "::error::expected freed=0 on the all-disabled no-op, got ${FREED}G"
            exit 1
          fi
          echo "No-op reclaim: freed=${FREED}G, available=${AVAILABLE}G"

  # ── login-to-ghcr ──────────────────────────────────────────
  test-login-to-ghcr:
    if: "${{ github.event_name != 'merge_group' && !startsWith(github.head_ref, 'release-please--') && !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧪 Run login-to-ghcr
        uses: ./login-to-ghcr
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ Verify GHCR login
        run: cat ~/.docker/config.json | grep -q "ghcr.io"

  # ── aggregate-job-checks ────────────────────────────────────
  test-aggregate-job-checks-empty:
    if: "${{ github.event_name != 'merge_group' && !startsWith(github.head_ref, 'release-please--') && !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧪 Run aggregate-job-checks with empty job-results (should succeed)
        uses: ./aggregate-job-checks
        with:
          job-results: ""

  test-aggregate-job-checks-success:
    if: "${{ github.event_name != 'merge_group' && !startsWith(github.head_ref, 'release-please--') && !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧪 Run aggregate-job-checks with all-success results
        uses: ./aggregate-job-checks
        with:
          job-results: "success skipped success"

  test-aggregate-job-checks-failure:
    if: "${{ github.event_name != 'merge_group' && !startsWith(github.head_ref, 'release-please--') && !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧪 Run aggregate-job-checks with a failed job (expected to fail)
        id: check
        continue-on-error: true
        uses: ./aggregate-job-checks
        with:
          job-results: "success failure skipped"

      - name: ✅ Verify step failed as expected
        shell: bash
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          if [[ "$OUTCOME" != "failure" ]]; then
            echo "::error::Expected the action to fail when a job failed, got: $OUTCOME"
            exit 1
          fi

  test-aggregate-job-checks-unknown:
    if: "${{ github.event_name != 'merge_group' && !startsWith(github.head_ref, 'release-please--') && !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧪 Run aggregate-job-checks with an unknown result (expected to fail)
        id: check
        continue-on-error: true
        uses: ./aggregate-job-checks
        with:
          job-results: "success unknown-status"

      - name: ✅ Verify step failed as expected
        shell: bash
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          if [[ "$OUTCOME" != "failure" ]]; then
            echo "::error::Expected the action to fail on an unknown result, got: $OUTCOME"
            exit 1
          fi

  # ── run-dotnet-tests ────────────────────────────────────────
  test-run-dotnet-tests:
    if: "${{ github.event_name != 'merge_group' && !startsWith(github.head_ref, 'release-please--') && !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
      code-quality: write # for the GitHub Code Quality coverage upload
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧪 Run run-dotnet-tests
        uses: ./run-dotnet-tests
        with:
          github-token: ${{ github.event_name != 'pull_request' && secrets.GITHUB_TOKEN || '' }}
          working-directory: .github/fixtures/run-dotnet-tests

      - name: 🔒 Verify pull-request tests received no GHCR credentials
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if dotnet nuget list source | grep -Fq 'github [Enabled]'; then
            echo "::error::Pull-request tests configured the authenticated GHCR feed"
            exit 1
          fi

  test-run-dotnet-tests-preserves-source-mapping:
    if: "${{ github.event_name != 'merge_group' && !startsWith(github.head_ref, 'release-please--') && !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    name: "[Test] Run .NET Tests - Preserve Source Mapping"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      code-quality: write
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10

      - name: 📦 Build mapped local package
        run: >-
          dotnet pack
          .github/fixtures/run-dotnet-tests-source-mapping/dependency/Fixture.Dependency.csproj
          --configuration Release
          --output .github/fixtures/run-dotnet-tests-source-mapping/local-packages
        shell: bash

      - name: 🧪 Restore and test with caller source mapping
        uses: ./run-dotnet-tests
        with:
          # Exercise the credential-bearing branch without exposing a real token to PR-controlled restore code.
          github-token: credential-boundary-sentinel
          working-directory: .github/fixtures/run-dotnet-tests-source-mapping/consumer

      - name: 🔒 Verify caller NuGet configuration is byte-identical
        run: >-
          git diff --exit-code --
          .github/fixtures/run-dotnet-tests-source-mapping/restore-config/NuGet.Config
        shell: bash

      - name: 🧪 Configure the canonical caller-owned GitHub Packages source
        id: canonical-source
        run: |
          set -euo pipefail
          config=.github/fixtures/run-dotnet-tests-source-mapping/restore-config/NuGet.Config
          cp "$config" "$RUNNER_TEMP/source-mapping-NuGet.Config"
          dotnet nuget add source \
            --configfile "$config" \
            --name github \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          echo "sha=$(sha256sum "$config" | cut -d ' ' -f 1)" >>"$GITHUB_OUTPUT"
        shell: bash

      - name: 🧪 Restore with the canonical caller-owned source
        uses: ./run-dotnet-tests
        with:
          github-token: credential-boundary-sentinel
          working-directory: .github/fixtures/run-dotnet-tests-source-mapping/consumer

      - name: 🔒 Verify the canonical caller-owned source is byte-identical
        env:
          EXPECTED_SHA: ${{ steps.canonical-source.outputs.sha }}
        run: |
          set -euo pipefail
          config=.github/fixtures/run-dotnet-tests-source-mapping/restore-config/NuGet.Config
          actual_sha="$(sha256sum "$config" | cut -d ' ' -f 1)"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::Authenticated restore changed the caller-owned GitHub Packages source"
            exit 1
          fi
          cp "$RUNNER_TEMP/source-mapping-NuGet.Config" "$config"
        shell: bash

      - name: 🧪 Prepare a symlinked caller NuGet configuration
        id: symlink-fixture
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/run-dotnet-tests-symlink"
          target="$RUNNER_TEMP/run-dotnet-tests-symlink.NuGet.Config"
          cp -R .github/fixtures/run-dotnet-tests "$workspace"
          cp .github/fixtures/run-dotnet-tests-source-mapping/restore-config/NuGet.Config "$target"
          ln -s "$target" "$workspace/NuGet.Config"
          echo "target_sha=$(sha256sum "$target" | cut -d ' ' -f 1)" >>"$GITHUB_OUTPUT"
          echo "link_target=$(readlink "$workspace/NuGet.Config")" >>"$GITHUB_OUTPUT"
        shell: bash

      - name: 🧪 Restore through a symlinked caller config
        uses: ./run-dotnet-tests
        with:
          github-token: credential-boundary-sentinel
          working-directory: ${{ runner.temp }}/run-dotnet-tests-symlink

      - name: 🔒 Verify the symlink and target bytes are preserved
        env:
          EXPECTED_LINK_TARGET: ${{ steps.symlink-fixture.outputs.link_target }}
          EXPECTED_TARGET_SHA: ${{ steps.symlink-fixture.outputs.target_sha }}
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/run-dotnet-tests-symlink"
          target="$RUNNER_TEMP/run-dotnet-tests-symlink.NuGet.Config"
          if [[ ! -L "$workspace/NuGet.Config" ]]; then
            echo "::error::Authenticated restore removed the caller's NuGet.Config symlink"
            exit 1
          fi
          if [[ "$(readlink "$workspace/NuGet.Config")" != "$EXPECTED_LINK_TARGET" ]]; then
            echo "::error::Authenticated restore changed the caller's NuGet.Config symlink target"
            exit 1
          fi
          if [[ "$(sha256sum "$target" | cut -d ' ' -f 1)" != "$EXPECTED_TARGET_SHA" ]]; then
            echo "::error::Authenticated restore changed the symlinked NuGet.Config target bytes"
            exit 1
          fi
        shell: bash

      - name: 🧪 Configure an untrusted source with the credential-bearing name
        run: >-
          dotnet nuget add source
          --configfile .github/fixtures/run-dotnet-tests-source-mapping/restore-config/NuGet.Config
          --name github
          ../local-packages
        shell: bash

      - name: 🛡️ Reject the untrusted credential target
