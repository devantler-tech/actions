  # the default — the OFF state every existing consumer gets. This job passes it as true.
  # Together they cover both states of the flag, per AGENTS.md "Shipping a new capability
  # behind an opt-in flag": a flag whose off-path is untested can regress silently, and so
  # can an on-path that was never instantiated.
