  # behaves correctly in both states of it — NOT that a default-branch push scans, which
  # no pull-request-triggered job can demonstrate (`github.ref` here is a PR merge ref, so
  # the default-branch arm is unreachable by construction). The reachability of that arm is
  # what the structural guard in test-govulncheck-main-coverage.sh asserts instead.
  test-validate-go-project-scan-default-branch:
    if: "${{ github.event_name != 'merge_group' && !startsWith(github.head_ref, 'release-please--') && !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
