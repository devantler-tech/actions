name: 📤 Apply Signed Fixes

# Commits a previously-exported patch back to a pull request branch as a SIGNED commit.
#
# Automation commits made with the git CLI on a runner are unsigned, and unsigned automation
# commits are what keep commit-signature verification from being extendable past the default
# branch (devantler-tech/.github#142). A commit created through the GitHub commit API with an
# App token is signed by GitHub, so this workflow creates it that way and then reads the new
# commit's own verification object to prove it.
#
# The caller runs the fixer and exports its result as a patch artifact; this workflow mints
# the write credential on a FRESH runner and commits it. That split is deliberate: a fixer
# configured from the pull request under review may execute arbitrary commands, so it must
# never run in a job that holds a write-scoped token.
#
# Callers own the one gate this workflow cannot see: whether auto-fixing is enabled at all.
# Whether the fixer produced anything is passed IN as `fixes-created` rather than used by the
# caller to skip the call, because the branch tip still has to be checked when it produced
# nothing — that is exactly the replacement run after a cancelled committing run. Everything
# observable from the pull request itself is gated here, so a caller cannot forget it.
#
# Patch convention: the artifact named `artifact-name` contains one file, `<artifact-name>.patch`.

on:
  workflow_call:
    inputs:
      artifact-name:
        required: false
        type: string
        default: megalinter-fixes
        description: "Name of the uploaded patch artifact. It must contain a single file named `<artifact-name>.patch`."
      commit-message:
        required: false
        type: string
        default: "chore: Apply megalinter fixes"
        description: "Commit message headline for the applied fixes."
      pr-owner:
        required: false
        type: string
        default: ""
        description: "Pull request author login. Commits are suppressed for dependency-bot pull requests, whose branches are owned by their automation."
      fixes-created:
        required: false
        type: boolean
        default: true
        description: "Whether the caller's fixer produced a patch on THIS run. False means the fixer ran clean, so no artifact exists: the signing steps are skipped and only the branch-tip signature check runs."
    secrets:
      APP_PRIVATE_KEY:
        description: "GitHub App private key. Required: the signing commit API needs an App token, and there is no unsigned fallback."
        required: false

permissions: {}

jobs:
  apply-fixes:
    name: 📤 Apply signed fixes
    if: |
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.fork != true
      && !contains(fromJSON('["dependabot[bot]","dependabot","renovate[bot]","renovatebot","renovate"]'), github.event.pull_request.user.login)
      && !contains(fromJSON('["dependabot[bot]","dependabot","renovate[bot]","renovatebot","renovate"]'), inputs.pr-owner)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # This job checks out the pull request's head branch while holding an App token scoped
    # `contents: write`. That is only safe because NO step below executes code from the
    # checked-out tree: every `uses:` is a SHA-pinned third-party action, and the three `run:`
    # blocks invoke git, jq, base64 and gh and nothing out of the repository. CodeQL alert 312
    # (actions/untrusted-checkout) was dismissed on exactly that property.
    #
    # Dismissal is per-alert, not per-condition, so the alert does not re-fire if the property
    # stops holding. Assertions 11-13 in .github/tests/test-lint-signed-commit.sh enforce it
    # instead: 11 pins every `uses:` to an audited SHA-pinned identity, 12 pins the step
    # inventory, and 13 pins the job by CONTENT -- its whole structure (so `env`, `shell`,
    # `working-directory`, `defaults.run` and any future key are covered without being listed) plus
    # EVERY run block's text -- every one, because a pre-checkout step can write BASH_ENV into
    # $GITHUB_ENV and GitHub hands that to later steps. Dependency bumps do not fire.
    # Editing those blocks means re-auditing and updating the pin (devantler-tech/actions#1019).
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # Runs on EVERY call, including the ones where the fixer produced nothing, and needs
      # only a read — which is why it sits before the App token rather than inside the
      # signing steps below.
      #
      # Committing raises `synchronize`, and that run can cancel the committing one before it
      # verifies. The replacement run's fixer then finds its own work already done and reports
      # no patch, so every signing step here is skipped — and with them, historically, the
      # verification too: the caller's `fixes-created` gate skipped this whole workflow, and
      # the already-applied fallback inside the commit step was unreachable in the one case it
      # was written for. So the tip check lives here, where nothing gates it.
      #
      # It reads the head commit through the API rather than checking out: the commit that
      # triggered this run is exactly the one to verify, and its message and verification
      # object come back in the same call.
      #
      # Scoped by commit message, so a lane verifies only its OWN applied-fixes commit. Every
      # lane calls this workflow with its own `commit-message`, so between them they cover
      # each message, and an ordinary contributor commit at the tip matches none of them and
      # is correctly held to no signature it was never supposed to carry.
      - name: 🔏 Verify an applied-fixes head is signed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMIT_MESSAGE: ${{ inputs.commit-message }}
        shell: bash
        run: |
          set -euo pipefail
          # Capture, then test with a builtin: `gh api` failing mid-pipeline must not read as
          # "not an applied-fixes commit", which would silently skip the check this step is.
          if ! head_json="$(gh api "repos/${REPO}/commits/${HEAD_SHA}")"; then
            echo "::error::Could not read head commit ${HEAD_SHA} to check its signature."
            exit 1
          fi
          headline="$(jq -r '.commit.message | split("\n")[0]' <<<"$head_json")"
          if [ "$headline" != "${COMMIT_MESSAGE}" ]; then
            echo "Head ${HEAD_SHA} is not this lane's applied-fixes commit; nothing to verify."
            exit 0
          fi
          verified="$(jq -r '.commit.verification.verified' <<<"$head_json")"
          if [ "$verified" != "true" ]; then
            echo "::error::Applied-fixes commit ${HEAD_SHA} is not signed (verified=${verified})."
            exit 1
          fi
          echo "Verified signature on ${HEAD_SHA}."

      # `== true` rather than the bare truthiness test: a `workflow_call` boolean input arrives
      # as a real boolean, but if one ever reached here as a STRING the bare form would treat
      # "false" as truthy and run the privileged path. Comparing to `true` fails the other way —
      # an unexpected type skips the signing rather than performing it unasked.
      - name: 🔑 Generate GitHub App Token
        if: ${{ inputs.fixes-created == true }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      # Check out the PULL REQUEST BRANCH, not the default merge ref. Two things depend on
      # it: the patch must apply to the tree the commit will be based on, and
      # expectedHeadOid below must be that branch's tip. Resolving HEAD from a merge ref
      # would pin the mutation to a commit that exists on no branch.
      #
      # persist-credentials stays false. The commit is created through the GitHub API, so
      # nothing here pushes over git, and leaving a write-scoped token in .git/config would
      # be a standing credential this job has no use for. The token is still passed to
      # `with.token` because the checkout itself has to read the repository.
      - name: 📄 Checkout
        if: ${{ inputs.fixes-created == true }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
          token: ${{ steps.generate-token.outputs.token }}

      - name: 📥 Download applied fixes
        if: ${{ inputs.fixes-created == true }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}

      # The patch was produced against the merge ref and is applied here to the branch
      # tip, so it fails when the base has since changed one of the same files. Failing is
      # the correct outcome: the alternative is committing the MERGED content of that file
      # onto the branch, which silently imports base changes into someone's pull request.
      # A rebase resolves it.
      - name: Apply fixes
        if: ${{ inputs.fixes-created == true }}
        env:
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
        shell: bash
        run: |
          set -euo pipefail
          patch="${RUNNER_TEMP}/${ARTIFACT_NAME}.patch"
          # A replacement run can arrive with these fixes already on the branch: committing
          # raises `synchronize`, and that run checks out github.head_ref, which now contains
          # them. The patch then does not apply, and failing here would skip the signature
          # verification the commit step performs for exactly that case.
          # --reverse --check succeeds only when the patch is present in full, so a base
          # change that touched one of the same files still falls through and fails below.
          if git apply --reverse --check "$patch" 2>/dev/null; then
            echo "Patch is already applied on this branch; nothing to stage."
            exit 0
          fi
          git apply --index "$patch"

      # Commit through the GraphQL API rather than `git commit` + push. Commits created
      # through the API with an App token are signed by GitHub; a CLI commit from a runner
      # is not, and unsigned automation commits are what keep signature enforcement from
      # being extendable past the default branch (devantler-tech/.github#142).
      #
      # Limitation inherited from the API: FileAddition carries a path and its contents and
      # nothing else, so file modes are not expressible. Anything that is not a regular
      # non-executable file is rejected below rather than silently losing its mode or
      # having a symlink dereferenced into an ordinary file.
      - name: 📤 Commit the applied fixes
        if: ${{ inputs.fixes-created == true }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          BRANCH: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
          COMMIT_MESSAGE: ${{ inputs.commit-message }}
        run: |
          set -euo pipefail

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          additions="$workdir/additions.ndjson"
          deletions="$workdir/deletions.ndjson"
          : >"$additions"
          : >"$deletions"

          # The whole point of using the API is that the commit is signed, so prove it
          # rather than assume it. An unsigned commit here would re-create exactly the
          # condition this step exists to remove, and would do it silently.
          verify_signed() {
            local sha="$1"
            local verified
            verified="$(gh api "repos/${REPO}/commits/${sha}" --jq '.commit.verification.verified')"
            if [ "$verified" != "true" ]; then
              echo "::error::Applied-fixes commit ${sha} is not signed (verified=${verified})."
              exit 1
            fi
            echo "Verified signature on ${sha}."
          }

          # Written to a file rather than read through process substitution: a process
          # substitution's exit status is invisible to both `set -e` and `pipefail`, so a
          # failing `git status` would look exactly like "nothing to commit" and leave the
          # branch silently unfixed with a green build.
          # -uall lists untracked files individually; without it git collapses a new
          # directory into a single "dir/" entry, which is not a file we can encode.
          git status --porcelain -z --no-renames -uall >"$workdir/status"

          while IFS= read -r -d '' entry; do
            entry_status="${entry:0:2}"
            entry_path="${entry:3}"
            [ -n "$entry_path" ] || continue
            case "$entry_status" in
              *D*)
                jq -n --arg p "$entry_path" '{path: $p}' >>"$deletions"
                ;;
              *)
                # FileAddition carries a path and its contents and nothing else, so a mode
                # cannot be SET. It is, however, INHERITED: measured 2026-08-24 against this
                # repository, createCommitOnBranch modifying a path already at 100755 in the
                # base tree left it at 100755 (and the commit verified), while a NEWLY ADDED
                # executable file landed at 100644 — the bit was silently dropped.
                #
                # So the test is not "is this file executable" but "does the mode this commit
                # would produce differ from the mode the file has now". Rejecting every
                # executable file also rejects the modify case, which is the overwhelmingly
                # common one: a formatter rewriting an existing `.sh`. That would fail the job
                # for a fix the API handles correctly (66 such files in `platform`, 48 in
                # `ksail`, 30 here), so it is narrowed to the case that genuinely cannot be
                # expressed.
                if [ -L "$entry_path" ] || [ ! -f "$entry_path" ]; then
                  echo "::error file=${entry_path}::Applied fix is not a regular file; the commit API can express only regular files."
                  exit 1
                fi
                if [ -x "$entry_path" ]; then wanted_mode=100755; else wanted_mode=100644; fi
                # Empty when the path is new in this commit, so a new executable file is
                # rejected (nothing to inherit) and a new ordinary file is accepted.
                # `--literal-pathspecs`: `git status --porcelain -z` emits raw unquoted paths, so a
                # changed file whose name begins with `:` reaches here verbatim and git reads it as
                # pathspec MAGIC rather than a path. Measured: for a tracked `:odd.sh` at mode
                # 100755, `ls-tree -- ':odd.sh'` returns EMPTY and exit 0, while the same call with
                # this flag returns 100755. That fails both ways — an empty base makes an existing
                # executable look like a mode change and be wrongly rejected, and an existing 100755
                # file turned non-executable reads as base 100644, so its real mode change is
                # committed silently, which is what this guard exists to stop.
                # (Glob characters are NOT the issue here: `ls-tree` applies no wildcard matching to
                # pathspecs — measured, `a*.sh` matches nothing with or without the flag.)
                base_mode="$(git --literal-pathspecs ls-tree --format='%(objectmode)' HEAD -- "$entry_path")"
                if [ "${base_mode:-100644}" != "$wanted_mode" ]; then
                  echo "::error file=${entry_path}::Applied fix would change the file mode to ${wanted_mode} (base ${base_mode:-none}); the commit API cannot express a mode, so this change cannot be committed here. Apply it locally and push."
                  exit 1
                fi
                # File content must never reach argv. Linux caps a single argv entry at
                # MAX_ARG_STRLEN (128 KiB) independently of ARG_MAX, and a formatter can
                # rewrite files far larger than that. --rawfile reads from disk instead,
                # and base64 output is ASCII so binary inputs survive the round trip.
                base64 -w0 <"$entry_path" >"$workdir/content.b64"
                jq -n --arg p "$entry_path" --rawfile c "$workdir/content.b64" \
                  '{path: $p, contents: ($c | gsub("\\s"; ""))}' >>"$additions"
                ;;
            esac
          done <"$workdir/status"

          if [ ! -s "$additions" ] && [ ! -s "$deletions" ]; then
            echo "No applied fixes left to commit."
            # Committing raises `synchronize` on the pull request. That new run shares this
            # workflow's concurrency group with cancel-in-progress, so it can cancel the
            # committing run before it verifies. The replacement run lands here with the
            # work already done — so verify the head rather than exiting blind, or a signing
            # regression escapes unreported.
            if [ "$(git log -1 --format=%s)" = "${COMMIT_MESSAGE}" ]; then
              echo "Head is an applied-fixes commit; verifying it here in case the run that created it was cancelled."
              verify_signed "$(git rev-parse HEAD)"
            fi
            exit 0
          fi

          # --slurpfile keeps the aggregate off argv too: the combined payload is bounded by
          # total changed content, which can exceed the same 128 KiB cap.
          jq -n \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg message "$COMMIT_MESSAGE" \
            --arg oid "$(git rev-parse HEAD)" \
            --slurpfile additions "$additions" \
            --slurpfile deletions "$deletions" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {
                input: {
                  branch: {
                    repositoryNameWithOwner: $repo,
                    branchName: $branch
                  },
                  message: { headline: $message },
                  expectedHeadOid: $oid,
                  fileChanges: { additions: $additions, deletions: $deletions }
                }
              }
            }' >"$workdir/mutation.json"

          # `gh api graphql` exits non-zero on a GraphQL error, so the assignment itself
          # would abort under `set -e` and skip these diagnostics. Handle the failure inline
          # so the operator gets a labelled annotation instead of one stderr line.
          if ! response="$(gh api graphql --input "$workdir/mutation.json" 2>"$workdir/stderr")"; then
            echo "::error::createCommitOnBranch failed"
            cat "$workdir/stderr" >&2
            jq '.errors // .' <<<"$response" 2>/dev/null || printf '%s\n' "$response"
            exit 1
          fi
          # Capture first, then assert with a builtin. `jq -e` as the if-condition cannot
          # distinguish "the filter was false" (exit 1) from "jq itself failed" (exit 4 on
          # empty input, 5 on malformed), so a truncated or non-JSON response would take the
          # no-errors path and continue.
          errors="$(jq -c '.errors // empty' <<<"$response")"
          if [ -n "$errors" ]; then
            echo "::error::createCommitOnBranch failed"
            printf '%s\n' "$errors"
            exit 1
          fi

          oid="$(jq -r '.data.createCommitOnBranch.commit.oid // empty' <<<"$response")"
          if [ -z "$oid" ]; then
            echo "::error::createCommitOnBranch returned no commit oid"
            printf '%s\n' "$response"
            exit 1
          fi
          echo "Committed applied linter fixes as ${oid}."
          verify_signed "$oid"
