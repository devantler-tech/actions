name: 📦 Publish Manifests
on:
  workflow_call:
    inputs:
      oci-name:
        description: >-
          OCI repository name (`<owner>/<name>`) the manifests artifact is
          published under, WITHOUT the registry prefix or the trailing
          `/manifests` suffix. Defaults to the caller's `github.repository`.
          Override when the repo name is an invalid OCI path component — e.g. the
          org `.github` repo (leading dot) publishes under
          `devantler-tech/github-config`.
        required: false
        default: ""
        type: string
      deploy-path:
        description: "Path to the Kubernetes manifests directory packaged as the OCI artifact."
        required: false
        default: ./deploy
        type: string
      dry-run:
        description: "Skip publish (validate workflow interface only)."
        required: false
        default: false
        type: boolean
      enable-caller-pin:
        description: "Enforce that the caller pinned this workflow to a commit SHA before signing. Opt-in while rolling out; see AGENTS.md 'Shipping a new capability behind an opt-in flag'."
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  publish-manifests:
    name: Publish manifests
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: write # push manifests OCI artifact
      id-token: write # keyless cosign signing (Fulcio/Rekor via GitHub OIDC)
    env:
      REGISTRY: ghcr.io # auth uses GITHUB_TOKEN, which is GHCR-scoped
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: 🔒 Require a v* tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ] || ! printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::publish-manifests must be invoked from a semver tag vX.Y.Z (got $REF_TYPE/$REF_NAME); Flux OCIRepository semver selection depends on it."
            exit 1
          fi

      - name: 🔎 Resolve the calling ref from the OIDC claim
        id: caller
        if: ${{ inputs.enable-caller-pin }}
        run: |
          # github.job_workflow_ref is NOT exposed in the expression context — measured empty inside
          # a called reusable workflow, while github.workflow_ref (the caller's own entry workflow)
          # resolves fine. The value that actually reaches the cosign certificate's SAN is the OIDC
          # token's job_workflow_ref claim, so read it from the token: same source, same value.
          token="$(curl -fsS --max-time 10 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore" | jq -r '.value')"
          payload="$(printf '%s' "$token" | cut -d. -f2)"
          case $((${#payload} % 4)) in
            2) payload="${payload}==" ;;
            3) payload="${payload}=" ;;
          esac
          ref="$(printf '%s' "$payload" | tr '_-' '/+' | base64 -d | jq -r '.job_workflow_ref // ""')"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: 🔒 Require a SHA-pinned caller
        if: ${{ inputs.enable-caller-pin }}
        env:
          JOB_WORKFLOW_REF: ${{ steps.caller.outputs.ref }}
        run: |
          # This job mints a keyless cosign certificate whose SAN is this workflow's own
          # job_workflow_ref, and the cluster's trust rules verify signatures against it. A branch
          # or tag ref would let a superseded revision of this workflow mint a signature the
          # cluster still trusts, so require the one ref form that cannot move: a commit SHA.
          ref="${JOB_WORKFLOW_REF##*@}"
          if ! printf '%s' "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::publish-manifests must be called by a 40-character commit SHA, not '@${ref}'. Pin the caller as devantler-tech/actions/.github/workflows/publish-manifests.yaml@<sha> (Renovate keeps that pin current)."
            exit 1
          fi

      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔐 Log in to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ env.GH_TOKEN }}

      - name: ⚙️ Setup Flux CLI
        uses: fluxcd/flux2/action@889be9d6cc8afa8ed639e1e1ba4ab678e3b38d8c # v2.9.4

      - name: ✍️ Setup Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: 📦 Push & sign manifests artifact
        env:
          REGISTRY: ${{ env.REGISTRY }}
          OCI_NAME: ${{ inputs.oci-name }}
          DEPLOY_PATH: ${{ inputs.deploy-path }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Default the OCI name to the caller repo; override (oci-name) for repos
          # whose name is an invalid OCI path component, e.g. `.github`.
          NAME="${OCI_NAME:-$REPOSITORY}"
          VERSION="${REF_NAME#v}"
          ARTIFACT="${REGISTRY}/${NAME}/manifests"
          flux push artifact "oci://${ARTIFACT}:${VERSION}" \
            --path="${DEPLOY_PATH}" \
            --source="${SERVER_URL}/${REPOSITORY}" \
            --revision="${REF_NAME}@sha1:${SHA}" \
            --creds "${ACTOR}:${GH_TOKEN}"
          flux tag artifact "oci://${ARTIFACT}:${VERSION}" --tag latest --creds "${ACTOR}:${GH_TOKEN}"
          # Resolve tag → digest and sign by digest (keyless via OIDC): cosign
          # signs exactly the resolved bytes — no tag→digest TOCTOU if the tag
          # moves — and stays forward-compatible with cosign dropping tag-based
          # signing. docker buildx imagetools is preinstalled on ubuntu-latest;
          # cosign's own `cosign manifest digest` was removed in cosign v3.0.
          DIGEST=$(docker buildx imagetools inspect "${ARTIFACT}:${VERSION}" --format '{{ .Manifest.Digest }}')
          cosign sign --yes "${ARTIFACT}@${DIGEST}"
