name: ✅ Validate Go Project

on:
  workflow_call:
    inputs:
      pr-owner:
        required: false
        type: string
        description: "Pull request author login (used to disable auto-commit for bot PRs)"
      apply-signed-fixes:
        required: false
        type: boolean
        default: false
        description: "Opt in to signed auto-fix commits on same-repository pull requests. Off by default while this new write path is rolled out. When off (and on forks or non-PR events), fixer lanes still run and fail with their diff when changes remain."
      working-directory:
        required: false
        type: string
        default: ""
        description: "Go module directory to validate. Empty = repo root (the normal consumer case); the CI self-test sets it to a fixture so this workflow can run in a repo that is not itself a Go module."
      scan-default-branch:
        required: false
        type: boolean
        default: false
        description: "Opt in to the vulnerability scan's corrected coverage: it then runs on every default-branch invocation rather than only on pull requests, and a pull request that edits only a .govulncheck-allow.txt runs it too, so a risk acceptance is validated by the scanner it applies to. Off by default because both are behaviour changes for every consumer: a default branch that was reporting green can legitimately go red the moment an advisory is published against code that was already merged, and an allowlist-only pull request that used to skip the scan starts paying for it. Callers that omit this input keep the previous behaviour exactly. Roll out caller-by-caller, then flip this default to true and remove the input (devantler-tech/actions#788)."
      test-default-branch:
        required: false
        type: boolean
        default: true
        description: "Run the Go test suite on every default-branch invocation, rather than only when the diff touched a Go file. `go` answers 'did a Go source file change', which is narrower than 'could the suite's verdict have changed': a Go test may read a non-Go file as its subject, so a commit touching only those files skips the suite while breaking it, and the default branch keeps reporting green. On by default, so a consumer inherits the corrected coverage without knowing this input exists; the default branch then reports whatever the suite actually says, which may be red. Set it to false only to accept a default branch whose green does not mean the suite ran (devantler-tech/ksail#6373)."
    secrets:
      APP_PRIVATE_KEY:
        description: "GitHub App Private Key"
        required: false
  ### Required Workflow Triggers ###
  pull_request:
  merge_group:
  ##################################

# Invocation-aware concurrency: two invocations that differ in any way are different
# logical invocations and must not cancel each other. Only reruns of the SAME invocation
# supersede. Two discriminators are needed, for two separate collisions both seen live:
#
#   * github.workflow — separates the org-required direct run (github.workflow == this
#     workflow's name) from a caller's reusable-workflow self-test (a reusable workflow
#     inherits the CALLER's github.workflow, e.g. the CI workflow). Without it both share
#     one group on the same repository+ref and cancel each other, failing the aggregate
#     required check nondeterministically (devantler-tech/actions#587).
#
#   * the invocation's inputs — separates two calls from the SAME caller workflow on the
#     same ref, which github.workflow alone cannot tell apart. The both-states self-tests
#     for `scan-default-branch` are exactly that shape: same caller, same ref, differing
#     only by input, so the second silently cancelled the first.
#
# Adding a discriminator only ever splits groups further; it cannot merge two that were
# separate, so this direction of change cannot reintroduce #587.
concurrency:
  group: "validate-go-project-${{ github.repository }}-${{ github.ref }}-${{ github.workflow }}-${{ inputs.pr-owner }}-${{ inputs.working-directory }}-${{ inputs.scan-default-branch }}-${{ inputs.test-default-branch }}-${{ inputs.apply-signed-fixes }}"
  cancel-in-progress: true

permissions: {}

jobs:
  # Detect if Go files changed to conditionally skip jobs for non-Go changes
  changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    # Ignore Required Workflow runs on the reusable-workflows repo itself
    # Skip merge queue — these checks already passed on the PR
    if: >-
      (inputs.working-directory != '' || github.repository != 'devantler-tech/actions')
      && github.event_name != 'merge_group'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      govulncheck: ${{ steps.filter.outputs.govulncheck }}
      lintable: ${{ steps.filter.outputs.lintable }}
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔍 Filter paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - '.golangci.yaml'
            # The allowlist decides which advisories the vuln scan accepts, so a change to
            # it changes the gate's verdict on unchanged code: without this filter, editing
            # the allowlist skips the very scan that reads it.
            #
            # It is a filter of its OWN rather than an entry in `go:` on purpose. `go` is
            # consumed by go-mod-tidy, golangci-lint, deadcode, the test matrix and the
            # coverage upload as well; folding the allowlist into it would make an
            # allowlist-only commit run all of those in every consumer repo, so an
            # administrative risk-acceptance could be blocked by a pre-existing failure
            # somewhere else entirely. This output is OR-ed into the govulncheck job alone.
            #
            # Both forms are listed because `working-directory` may point at a nested
            # module, whose allowlist lives at e.g. `services/api/.govulncheck-allow.txt`
            # — a root-only pattern would leave that edit unscanned.
            govulncheck:
              - '.govulncheck-allow.txt'
              - '**/.govulncheck-allow.txt'
            # Files lintable by MegaLinter Go flavor (excluding Go files which are covered above)
            lintable:
              # Languages
              - '**/*.sh'
              - '**/*.bash'
              - '**/*.groovy'
              - '**/*.gradle'
              - '**/*.kt'
              - '**/*.kts'
              - '**/*.sql'
              # Formats
              - '**/*.css'
              - '**/*.scss'
              - '**/*.env'
              - '.env*'
              - '**/*.graphql'
              - '**/*.gql'
              - '**/*.html'
              - '**/*.htm'
              - '**/*.json'
              - '**/*.md'
              - '**/*.markdown'
              - '**/*.proto'
              - '**/*.xml'
              - '**/*.yaml'
              - '**/*.yml'
              # Tooling formats
              - '.github/workflows/**'
              - '**/Dockerfile*'
              - '**/*.dockerfile'
              - '.editorconfig'
              - '**/Chart.yaml'
              - '**/values.yaml'
              - '**/templates/**/*.yaml'
              - '**/templates/**/*.yml'
              # Linter config files (changes to these should trigger linting)
              - '.mega-linter.yml'
              - '.mega-linter.yaml'
              - '.markdownlint.json'
              - '.markdownlint.yaml'
              - '.markdownlint.yml'
              - '.yamllint.yml'
              - '.yamllint.yaml'
              - '.hadolint.yaml'
              - '.hadolint.yml'
              - '.cspell.json'
              - 'cspell.json'
              - '.vale.ini'
              - '.prettierrc'
              - '.prettierrc.*'
              - 'lychee.toml'
              - '.ls-lint.yml'
              - '.secretlintrc.*'
              - '.gitleaksignore'

  tidy:
    name: 📦 Tidy
    runs-on: ubuntu-latest
    needs: [changes]
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || '.' }}
    # Skip if no Go files changed or on main/master branches or on reusable-workflows repo or in merge queue
    if: |
      github.repository != 'devantler-tech/reusable-workflows'
      && needs.changes.outputs.go == 'true'
      && github.ref != 'refs/heads/main'
      && github.ref != 'refs/heads/master'
      && github.event_name != 'merge_group'
    outputs:
      fixes-created: ${{ steps.fixes.outputs.changed }}
      fixes-artifact: ${{ steps.fixes.outputs.artifact-name }}
    permissions:
      # `go mod tidy` resolves and downloads modules named by the pull request under review,
      # so this job holds no credential that can write to the branch. The commit is made on a
      # fresh runner by apply-signed-fixes.yaml.
      contents: read
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.working-directory || '.' }}/go.mod

      - name: 🧹 go mod tidy
        run: go mod tidy

      # Anchored at the repository ROOT: `git add .` is cwd-scoped and this job's
      # defaults.run.working-directory can be a nested module.
      - name: 📦 Prepare applied fixes
        id: fixes
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          FIXES_ARTIFACT: tidy-fixes-${{ job.check_run_id }}
        run: |
          echo "artifact-name=${FIXES_ARTIFACT}" >> "$GITHUB_OUTPUT"
          git add --intent-to-add .
          if git diff --quiet HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --binary --full-index HEAD > "${RUNNER_TEMP}/${FIXES_ARTIFACT}.patch"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 📤 Upload applied fixes
        if: ${{ inputs.apply-signed-fixes == true && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true && !contains(fromJSON('["dependabot[bot]","dependabot","renovate[bot]","renovatebot","renovate"]'), github.event.pull_request.user.login) && !contains(fromJSON('["dependabot[bot]","dependabot","renovate[bot]","renovatebot","renovate"]'), inputs.pr-owner) && steps.fixes.outputs.changed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.fixes.outputs.artifact-name }}
          path: ${{ runner.temp }}/${{ steps.fixes.outputs.artifact-name }}.patch
          if-no-files-found: error

      - name: ❌ Fail if uncommitted changes remain (read-only mode)
        if: ${{ steps.fixes.outputs.changed == 'true' && (inputs.apply-signed-fixes != true || github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == true || contains(fromJSON('["dependabot[bot]","dependabot","renovate[bot]","renovatebot","renovate"]'), github.event.pull_request.user.login) || contains(fromJSON('["dependabot[bot]","dependabot","renovate[bot]","renovatebot","renovate"]'), inputs.pr-owner)) }}
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Auto-fix produced changes while signed fix commits are disabled for this run. Please run the fix locally and push."
            echo ""
            echo "Changed files:"
            git diff --stat
            echo ""
            echo "Full diff:"
            git diff
            exit 1
          fi

  golangci-lint:
    name: 🧹 Lint - golangci-lint
    runs-on: ubuntu-latest
    needs: [changes]
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || '.' }}
    # Skip if no Go files changed or on reusable-workflows repo
    if: |
      github.repository != 'devantler-tech/reusable-workflows'
      && needs.changes.outputs.go == 'true'
    outputs:
      fixes-created: ${{ steps.fixes.outputs.changed }}
      fixes-artifact: ${{ steps.fixes.outputs.artifact-name }}
    permissions:
      # golangci-lint's configuration comes from the pull request under review, so this job
      # holds no credential that can write to the branch. The commit is made on a fresh
      # runner by apply-signed-fixes.yaml.
      contents: read
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.working-directory || '.' }}/go.mod

      - name: 🧹 Run golangci-lint
        id: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          working-directory: ${{ inputs.working-directory || '.' }}
          args: --fix
          # Skip the action's `config verify` step: it fetches the golangci-lint
          # JSONSchema over the network (golangci-lint.run), which intermittently
          # times out ("context deadline exceeded") and fails the lint job. The
          # config is still validated at runtime by `golangci-lint run`.
          verify: false

      # Anchored at the repository ROOT: `git add .` is cwd-scoped and this job's
      # defaults.run.working-directory can be a nested module.
      - name: 📦 Prepare applied fixes
        id: fixes
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          FIXES_ARTIFACT: golangci-lint-fixes-${{ job.check_run_id }}
        run: |
          echo "artifact-name=${FIXES_ARTIFACT}" >> "$GITHUB_OUTPUT"
          git add --intent-to-add .
          if git diff --quiet HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --binary --full-index HEAD > "${RUNNER_TEMP}/${FIXES_ARTIFACT}.patch"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 📤 Upload applied fixes
        if: ${{ inputs.apply-signed-fixes == true && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true && !contains(fromJSON('["dependabot[bot]","dependabot","renovate[bot]","renovatebot","renovate"]'), github.event.pull_request.user.login) && !contains(fromJSON('["dependabot[bot]","dependabot","renovate[bot]","renovatebot","renovate"]'), inputs.pr-owner) && steps.fixes.outputs.changed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.fixes.outputs.artifact-name }}
          path: ${{ runner.temp }}/${{ steps.fixes.outputs.artifact-name }}.patch
          if-no-files-found: error

      - name: ❌ Fail if uncommitted changes remain (read-only mode)
        if: ${{ steps.fixes.outputs.changed == 'true' && (inputs.apply-signed-fixes != true || github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == true || contains(fromJSON('["dependabot[bot]","dependabot","renovate[bot]","renovatebot","renovate"]'), github.event.pull_request.user.login) || contains(fromJSON('["dependabot[bot]","dependabot","renovate[bot]","renovatebot","renovate"]'), inputs.pr-owner)) }}
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Auto-fix produced changes while signed fix commits are disabled for this run. Please run the fix locally and push."
            echo ""
            echo "Changed files:"
            git diff --stat
            echo ""
            echo "Full diff:"
            git diff
            exit 1
          fi

  deadcode:
    name: 🔍 Dead Code Analysis
    runs-on: ubuntu-latest
    needs: [changes]
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || '.' }}
    # Skip if no Go files changed or on reusable-workflows repo; only on PRs
    if: |
      github.repository != 'devantler-tech/reusable-workflows'
      && needs.changes.outputs.go == 'true'
      && github.event_name == 'pull_request'
    permissions:
      contents: read
    # `deadcode -test ./...` builds a whole-program SSA call graph in memory (same shape
    # as govulncheck below), whose peak grows with the module's dependency graph. On large
    # modules (ones importing Kubernetes / Flux / Talos clients) the peak exhausts the
    # hosted runner's RAM, which the host resolves by killing the runner mid-analysis
    # (exit 143 / "runner has received a shutdown signal") — an opaque, retry-resistant
    # failure, not a real dead-code finding. GOMEMLIMIT caps the Go runtime's heap so the
    # GC reclaims aggressively and stays under the host ceiling instead of OOM-killing;
    # timeout-minutes bounds the worst case to a clear, fast failure rather than a hung
    # runner. ubuntu-latest provides 16 GiB RAM; leave headroom for the OS, the Go
    # toolchain subprocesses and harden-runner.
    timeout-minutes: 15
    env:
      GOMEMLIMIT: 12GiB
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.working-directory || '.' }}/go.mod
          cache: true

      - name: 📥 Install deadcode
        # Bounded retry so a transient module-proxy 5xx / network blip on this
        # required-check path can't red the gate (reliability invariant — #305).
        # go install is idempotent, so re-running it is always safe.
        run: |
          for attempt in 1 2 3; do
            if go install golang.org/x/tools/cmd/deadcode@v0.43.0; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::deadcode install failed (attempt ${attempt}/3); retrying in $((attempt * 5))s..."
              sleep "$((attempt * 5))"
            fi
          done
          echo "::error::Failed to install deadcode after 3 attempts."
          exit 1

      - name: 🔍 Check for dead code
        run: |
          output_file="$(mktemp)"
          trap 'rm -f "$output_file"' EXIT

          deadcode -test ./... >"$output_file"

          if [ -s "$output_file" ]; then
            echo "::error::Dead code detected. Remove unreachable functions before merging."
            cat "$output_file"
            exit 1
          fi
          echo "No dead code found ✅"

  govulncheck:
    name: 🛡️ Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [changes]
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || '.' }}
    # A vulnerability scan's verdict depends on the vulnerability DATABASE as well as the
    # diff: an advisory published after a merge makes unchanged, already-merged code
    # vulnerable. Two separate conditions each hid that on the default branch —
    # `event_name == 'pull_request'` meant it never scanned at all, and the path filter
    # alone means a push touching no Go path (a README edit) skips the scan, so the branch
    # keeps reporting green while a newly-published advisory already applies to it.
    #
    # Fixing that changes behaviour in EVERY consumer repo at once, and the intended
    # consequence is that a default branch which was green CAN now go red. Per AGENTS.md
    # (*Shipping a new capability behind an opt-in flag*) it therefore ships behind
    # `scan-default-branch`, default false, to be rolled out caller-by-caller before the
    # default flips and the input is removed (#788).
    #
    # The two arms, and why each is shaped this way:
    #
    #   * PULL-REQUEST ARM — unflagged, and identical to the behaviour shipped today
    #     except that an allowlist-only change now also triggers it. A consumer that
    #     passes nothing gets exactly what it got before, which is what makes this
    #     backward-compatible. `govulncheck` is its own filter output rather than an entry
    #     in `go` so an allowlist edit triggers THIS job and not tidy/lint/deadcode/tests.
    #
    #   * DEFAULT-BRANCH ARM — the new capability, reachable only when a caller opts in.
    #     It tests `go != ''` rather than being unconditional because an EMPTY output means
    #     the `changes` job did not run at all (it is itself gated); a concrete 'true' or
    #     'false' proves the filter ran, so the arm stays independent of how skipped-`needs`
    #     propagate. It is deliberately NOT diff-gated beyond that: on the default branch,
    #     scanning is the point.
    #
    # The input is compared against both the boolean and the string because a workflow
    # reachable from more than one trigger receives it either way (AGENTS.md, *Gotchas*).
    if: |
      github.repository != 'devantler-tech/reusable-workflows'
      && ((
        (
          needs.changes.outputs.go == 'true'
          || (
            (inputs.scan-default-branch == true || inputs.scan-default-branch == 'true')
            && needs.changes.outputs.govulncheck == 'true'
          )
        )
        && github.event_name == 'pull_request'
      ) || (
        (inputs.scan-default-branch == true || inputs.scan-default-branch == 'true')
        && needs.changes.outputs.go != ''
        && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      ))
    permissions:
      contents: read
    # govulncheck's default symbol scan builds a whole-program call graph in memory,
    # whose peak grows with the module's dependency graph. On large modules (e.g. ones
    # importing Kubernetes / Flux / Talos clients) it can exhaust the hosted runner's RAM,
    # which the host resolves by killing the runner mid-scan (exit 143 / "runner has
    # received a shutdown signal") — an opaque, retry-resistant failure. GOMEMLIMIT caps
    # the Go runtime's heap so the GC reclaims aggressively and stays under the host
    # ceiling instead of OOM-killing; timeout-minutes bounds the worst case to a clear,
    # fast failure rather than a hung runner.
    #
    # 25 (not 20): a cold-cache scan of a large module legitimately takes most of the
    # previous limit. A KSail main run finished the scan after 17m44s, then setup-go's
    # cache-save post-step hit the 20-minute ceiling and cancelled an otherwise-passing
    # required check. 25 keeps a finite ceiling with headroom for both the scan and its
    # post-job cleanup. Guarded by test-govulncheck-timeout.
    timeout-minutes: 25
    env:
      # ubuntu-latest provides 16 GiB RAM; leave headroom for the OS, the Go toolchain
      # subprocesses and harden-runner.
      GOMEMLIMIT: 12GiB
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # govulncheck reports only vulnerabilities your code actually CALLS (call-graph
      # reachability), so the gate trips only on genuinely reachable issues —
      # imported-but-unreachable advisories never block. The action sets up Go from
      # go.mod, installs govulncheck, runs `govulncheck ./...`, and fails the job on any
      # reachable finding. (We check out above with persist-credentials:false, so the
      # action's own checkout is disabled via repo-checkout:false.)
      #
      # By default this is a strict gate that blocks on any reachable advisory. A consumer
      # that opts in by committing a `.govulncheck-allow.txt` (one accepted advisory ID per
      # line) gets the allowlist path: it can risk-accept a reachable advisory that has NO
      # upstream fix (`Fixed in: N/A`) — e.g. a server-side symbol a CLI links transitively
      # via k8s.io/kubernetes or docker/docker — with an explicit, version-controlled
      # justification, instead of wedging EVERY Go PR on that consumer indefinitely.
      #
      # We use the `devantler/govulncheck-action` fork (not the official
      # `golang/govulncheck-action`) on every path because: (1) it adds the `allow-file`
      # input the official lacks, and (2) its nested actions are SHA-pinned
      # (actions/checkout, actions/setup-go), whereas the official action's are tag-pinned
      # (actions/checkout@v4.1.1, actions/setup-go@v5.0.0). Consumers that enforce "require
      # actions pinned to a full-length commit SHA" reject those tags at JOB SETUP, and
      # GitHub validates every `uses:` in the job — even ones behind an unreached `if` — so
      # merely *referencing* the official action wedged the whole vuln-scan job on such repos.
      # With no allow-file the fork behaves exactly like the official (strict). Swap back to
      # `golang/govulncheck-action` once both `allow-file` and SHA-pinned internals land
      # upstream (the fork is Gerrit-ready at devantler/govulncheck-action@feat/allow-file).
      # See the action README for the allow-file format.
      - name: 🔎 Detect govulncheck allowlist
        id: govulncheck-allow
        run: |
          if [ -f .govulncheck-allow.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🛡️ Scan for known vulnerabilities
        uses: devantler/govulncheck-action@e92df19a112e291ce95619a05f03d9bb1339e2e5 # feat/allow-file (fork; pending upstream)
        with:
          repo-checkout: false
          work-dir: ${{ inputs.working-directory || '.' }}
          # Scan under the SAME Go version the consumer actually ships (its go.mod), so
          # govulncheck's stdlib analysis matches the produced binary. The fork's setup-go
          # receives BOTH go-version (default 'stable') and go-version-file, and in
          # actions/setup-go go-version WINS over go-version-file when both are non-empty —
          # so without this override the scan always ran under 'stable' (currently 1.26.3)
          # and IGNORED go.mod. That made the gate unable to clear a stdlib advisory whose
          # only fix ships in a Go release newer than the runner's 'stable' channel: a
          # consumer that bumps go.mod past 'stable' got an operational error
          # ("go.mod requires go >= X; running go <stable>; GOTOOLCHAIN=local") instead of a
          # passing scan, wedging its entire Go PR lane. Empty go-version-input lets setup-go
          # honour go-version-file (go.mod), installing the exact shipped version.
          go-version-input: ''
          go-version-file: ${{ inputs.working-directory || '.' }}/go.mod
          # present ⇒ honour the allowlist (JSON mode, risk-accept listed IDs); absent ⇒ '' ⇒ strict.
          #
          # Root-relative, like `go-version-file` above: the action resolves both paths from the
          # checkout root rather than from `work-dir`. The allowlist self-test in ci.yaml pins that
          # semantics — it passes `work-dir: .github/tests/govulncheck-allowlist` alongside a fully
          # prefixed `allow-file: .github/tests/govulncheck-allowlist/.govulncheck-allow.txt`.
          # `defaults.run.working-directory` does not apply here either, because it governs `run:`
          # steps only, never a `uses:` step's inputs. So a bare literal would send the scanner to
          # the ROOT allowlist while the detection step above — which IS a `run:` step, and so does
          # honour the default — reports the NESTED one as present, and a nested module's risk
          # acceptance would be silently dropped.
          allow-file: ${{ steps.govulncheck-allow.outputs.present == 'true' && format('{0}/.govulncheck-allow.txt', inputs.working-directory || '.') || '' }}

  lint:
    name: 🧹 Lint - mega-linter
    runs-on: ubuntu-latest
    needs: [changes]
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || '.' }}
    # Run if Go files OR other lintable files changed (markdown, yaml, json, etc.)
    if: |
      github.repository != 'devantler-tech/reusable-workflows'
      && (needs.changes.outputs.go == 'true' || needs.changes.outputs.lintable == 'true')
    outputs:
      fixes-created: ${{ steps.fixes.outputs.changed }}
      fixes-artifact: ${{ steps.fixes.outputs.artifact-name }}
    permissions:
      # Deliberately NOT `contents: write`. MegaLinter's configuration comes from the pull
      # request under review and can execute commands, so this job must never hold a token
      # that can push. The write credential is minted on a fresh runner in
      # apply-signed-fixes.yaml, which sees only the exported patch.
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.working-directory || '.' }}/go.mod

      # Keep this `uses:` in lockstep with lint.yaml's MegaLinter step so both consumers run
      # the same image and the failure-mode self-test always exercises the real gate.
      - name: 🧹 Lint
        id: ml
        uses: oxsecurity/megalinter/flavors/go@15e5b45552097e318c93de385779ce3b1084052c # v10.0.0
        env:
          DEFAULT_WORKSPACE: ${{ inputs.working-directory || '.' }}
          MEGALINTER_CONFIG: ${{ github.workspace }}/.mega-linter.yml
          VALIDATE_ALL_CODEBASE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY_FIXES: all
          APPLY_FIXES_EVENT: all
          APPLY_FIXES_MODE: commit
          # actionlint (<=1.7.12, bundled in MegaLinter) doesn't yet know the `code-quality`
          # permission scope that GitHub Code Quality coverage requires callers to grant, so it
          # reports a false "unknown permission scope" error. Ignore it until actionlint catches up.
          ACTION_ACTIONLINT_ARGUMENTS: -ignore code-quality

      # MegaLinter leaves its fixes in the working tree and does not commit them itself; the
      # commit was always a separate workflow step. Export that result as a patch instead, so
      # the credential that writes it is minted somewhere this job's PR-controlled linter
      # configuration cannot reach.
      #
      # Anchored at the repository ROOT on purpose: `git add .` is cwd-scoped and this job's
      # defaults.run.working-directory can be a nested module, which would silently drop any
      # untracked fix outside it. `git diff` emits root-relative paths regardless, which is what
      # apply-signed-fixes.yaml applies against.
      - name: 📦 Prepare applied fixes
        id: fixes
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          FIXES_ARTIFACT: megalinter-fixes-${{ job.check_run_id }}
        run: |
          echo "artifact-name=${FIXES_ARTIFACT}" >> "$GITHUB_OUTPUT"
          git add --intent-to-add .
          if git diff --quiet HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --binary --full-index HEAD > "${RUNNER_TEMP}/${FIXES_ARTIFACT}.patch"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 📤 Upload applied fixes
        if: ${{ inputs.apply-signed-fixes == true && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true && !contains(fromJSON('["dependabot[bot]","dependabot","renovate[bot]","renovatebot","renovate"]'), github.event.pull_request.user.login) && !contains(fromJSON('["dependabot[bot]","dependabot","renovate[bot]","renovatebot","renovate"]'), inputs.pr-owner) && steps.fixes.outputs.changed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.fixes.outputs.artifact-name }}
          path: ${{ runner.temp }}/${{ steps.fixes.outputs.artifact-name }}.patch
          if-no-files-found: error

      # Fork pull requests get no secrets, so nothing can ever be committed back to them. That
      # is unchanged by moving the commit to a signed lane, and so is the outcome a contributor
      # sees: the fixes are applied here and the full diff is printed, so the build fails with
      # something they can act on locally. Gated on the fork flag directly now that this job no
      # longer mints a token whose failure used to stand in for it.
      - name: ❌ Fail if uncommitted changes remain (read-only mode)
        if: ${{ steps.fixes.outputs.changed == 'true' && (inputs.apply-signed-fixes != true || github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == true || contains(fromJSON('["dependabot[bot]","dependabot","renovate[bot]","renovatebot","renovate"]'), github.event.pull_request.user.login) || contains(fromJSON('["dependabot[bot]","dependabot","renovate[bot]","renovatebot","renovate"]'), inputs.pr-owner)) }}
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Auto-fix produced changes while signed fix commits are disabled for this run. Please run the fix locally and push."
            echo ""
            echo "Changed files:"
            git diff --stat
            echo ""
            echo "Full diff:"
            git diff
            exit 1
          fi

  # ── Applying fixes ───────────────────────────────────────────────────────────────────────
  #
  # Signed branch writes are a new privileged path, so `apply-signed-fixes` is deliberately
  # default-off. That also fails closed for this workflow's direct pull_request trigger, where
  # workflow_call defaults are absent and the input evaluates falsey. Fixer jobs still run in
  # that state; if they change the tree, their read-only gate prints the diff and fails instead
  # of silently discarding the finding. Consumers can opt in through workflow_call while the
  # direct org-required path remains read-only until a later, separately reviewed rollout.
  #
  # The commit itself lives in apply-signed-fixes.yaml so every fixer lane in this repo commits
  # the same signed way: a `git commit` on a runner cannot be signed, and an unsigned automation
  # commit is what keeps signature enforcement from being extendable past the default branch
  # (devantler-tech/.github#142). Whether a lane changed anything is passed IN as
  # `fixes-created` rather than used to skip the call, because the branch tip still has to be
  # checked when it changed nothing — the replacement run after a cancelled committing run is
  # exactly that case. The pull_request / non-fork / dependency-bot gates are repeated
  # at the producer boundary so ineligible fix results take the explicit read-only failure path
  # instead of being uploaded and then silently discarded. The called workflow repeats them as
  # the write boundary, so a future caller cannot reach the commit by forgetting one.
  #
  # The three lanes are CHAINED rather than run in parallel, and that is load-bearing. Each
  # commit is created with `expectedHeadOid` pinned to the branch tip the job checked out, so
  # two lanes committing at once would race: the second's expected tip is already stale and the
  # mutation is rejected. Because the calls no longer skip, the chain now costs three short
  # job start-ups on every opted-in run. That is the price of the tip check being reachable at
  # all; only the signing steps INSIDE those jobs are gated on `fixes-created`, so a run whose
  # fixers were clean still mints no write-scoped token.
  #
  # `!cancelled()` rather than `always()`: a skipped predecessor must not
  # skip its successors, but a cancelled run should stop. Each successor explicitly accepts only
  # a successful or skipped signer predecessor; a failed signer leaves the branch tip uncertain.
  #
  # `!cancelled()` also drops the implicit `success()` on EVERY `needs` entry, not just the
  # chain predecessor, so each fixer job's own success is asserted explicitly. Without that a
  # lane that set `fixes-created` and then failed — its upload step erroring, say — would
  # still dispatch a commit for an artifact that is not there. `apply-tidy-fixes` needs no
  # such clause: it has one predecessor and keeps the implicit `success()`.
  apply-tidy-fixes:
    name: 📦 Tidy - apply fixes
    needs: tidy
    if: ${{ inputs.apply-signed-fixes == true }}
    uses: devantler-tech/actions/.github/workflows/apply-signed-fixes.yaml@78ce1aca1e4736f4c4fe24975b085938805421f7
    permissions:
      contents: read
    with:
      artifact-name: ${{ needs.tidy.outputs.fixes-artifact }}
      commit-message: "chore: tidy go modules"
      pr-owner: ${{ inputs.pr-owner }}
      fixes-created: ${{ needs.tidy.outputs.fixes-created == 'true' }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  apply-golangci-lint-fixes:
    name: 🧹 Lint - golangci-lint - apply fixes
    needs: [golangci-lint, apply-tidy-fixes]
    if: ${{ !cancelled() && inputs.apply-signed-fixes == true && needs.golangci-lint.result == 'success' && (needs.apply-tidy-fixes.result == 'success' || needs.apply-tidy-fixes.result == 'skipped') }}
    uses: devantler-tech/actions/.github/workflows/apply-signed-fixes.yaml@78ce1aca1e4736f4c4fe24975b085938805421f7
    permissions:
      contents: read
    with:
      artifact-name: ${{ needs.golangci-lint.outputs.fixes-artifact }}
      commit-message: "chore: apply golangci-lint fixes"
      pr-owner: ${{ inputs.pr-owner }}
      fixes-created: ${{ needs.golangci-lint.outputs.fixes-created == 'true' }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  apply-fixes:
    name: 🧹 Lint - apply fixes
    needs: [lint, apply-golangci-lint-fixes]
    if: ${{ !cancelled() && inputs.apply-signed-fixes == true && needs.lint.result == 'success' && (needs.apply-golangci-lint-fixes.result == 'success' || needs.apply-golangci-lint-fixes.result == 'skipped') }}
    uses: devantler-tech/actions/.github/workflows/apply-signed-fixes.yaml@78ce1aca1e4736f4c4fe24975b085938805421f7
    permissions:
      contents: read
    with:
      artifact-name: ${{ needs.lint.outputs.fixes-artifact }}
      commit-message: "chore: Apply megalinter fixes"
      pr-owner: ${{ inputs.pr-owner }}
      fixes-created: ${{ needs.lint.outputs.fixes-created == 'true' }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [changes]
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || '.' }}
    # Skip if no Go files changed or on reusable-workflows repo
    if: |
      github.repository != 'devantler-tech/reusable-workflows'
      && needs.changes.outputs.go == 'true'
    permissions:
      contents: write
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧹 Free disk space
        # Reclaim ~11+ GB by removing large preinstalled toolchains a Go
        # build/test never uses (Android SDK, .NET, GHC, …). A large consumer
        # module's `go build`/`go test ./...` build cache (and the coverage
        # job's `-race` binaries) can otherwise exhaust the runner disk —
        # observed as a hard "No space left on device" failure. Targeted
        # `rm -rf` only (avoids the slow apt-remove path); best-effort.
        run: |
          set -euo pipefail
          before=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/PyPy \
            /usr/local/share/powershell \
            /usr/share/miniconda || true
          after=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "Free disk on /: ${before}G -> ${after}G (gained $((after - before))G)"

      - name: ⚙️ Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.working-directory || '.' }}/go.mod
          cache: true

      - name: 🛠️ Build
        run: go build -v ./...

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: [changes]
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || '.' }}
    # Skip if no Go files changed or on reusable-workflows repo.
    #
    # `needs.changes.outputs.go` answers "did a Go SOURCE file change", which is a strictly
    # narrower question than "could this suite's verdict have changed". A Go test may read a
    # non-Go file as its subject: ksail's `internal/ciharness` package asserts against
    # `.github/workflows/*.yaml` and `.github/scripts/*.sh`. A commit touching only those
    # files therefore yields `go == 'false'` CORRECTLY — the filter is not misconfigured —
    # and this job skips CORRECTLY by its own rule, while the suite is in fact broken.
    # Measured on ksail: `a5ed9f85` (#6363) moved an EKS teardown guard out of a workflow's
    # inline `run:` into a script, breaking `TestEKSSmokePreparesCloudGitOpsAndBoundsCleanup`.
    # That push to `main` changed four files, none of them Go, so `go` was false, 🧪 Test was
    # skipped, and `main` reported green. Every later `main` run repeated that verdict until
    # an unrelated pull request that happened to touch Go files inherited the failure.
    #
    # On the default branch there is no diff worth trusting for this decision: that branch's
    # green IS the branch-protection signal, so it has to mean the suite ran. Fixing it
    # changes behaviour in every consumer at once, so it ships behind the opt-in
    # `test-default-branch` — the same shape `scan-default-branch` uses for the vuln scan.
    #
    # `needs.changes.outputs.go != ''` proves the filter actually RAN: an empty string means
    # the `changes` job itself was skipped (it is gated too), so a concrete 'true'/'false' is
    # the only evidence that this arm is deciding on a real answer.
    #
    # The input is compared against both the boolean and the string because a workflow
    # reachable from more than one trigger receives it either way (AGENTS.md, *Gotchas*).
    if: |
      github.repository != 'devantler-tech/reusable-workflows'
      && (
        needs.changes.outputs.go == 'true'
        || (
          (inputs.test-default-branch == true || inputs.test-default-branch == 'true')
          && needs.changes.outputs.go != ''
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        )
      )
    permissions:
      contents: write
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧹 Free disk space
        # Reclaim ~11+ GB by removing large preinstalled toolchains a Go
        # build/test never uses (Android SDK, .NET, GHC, …). A large consumer
        # module's `go build`/`go test ./...` build cache (and the coverage
        # job's `-race` binaries) can otherwise exhaust the runner disk —
        # observed as a hard "No space left on device" failure. Targeted
        # `rm -rf` only (avoids the slow apt-remove path); best-effort.
        run: |
          set -euo pipefail
          before=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/PyPy \
            /usr/local/share/powershell \
            /usr/share/miniconda || true
          after=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "Free disk on /: ${before}G -> ${after}G (gained $((after - before))G)"

      - name: ⚙️ Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.working-directory || '.' }}/go.mod
          cache: true

      - name: 📥 Restore kubeconform schema cache
        # A consumer whose Go tests exercise kubeconform-based schema validation (e.g.
        # ksail's pkg/client/kubeconform) fetches JSON schemas from
        # raw.githubusercontent.com/yannh/kubernetes-json-schema on every cold run —
        # with no persistent cache across CI jobs, every job re-fetched every schema,
        # which is what tripped upstream 429 rate-limiting across the whole matrix
        # (portfolio-wide 2026-07-09 incident). This restores the local cache dir
        # ksail's own kubeconform client already builds via `validator.Opts.Cache` —
        # no consumer-side change needed; harmless no-op for repos that never
        # populate this path. Restore/save are split (rather than a single
        # `actions/cache` step) so the save below can run with `if: always()` — the
        # Test step below is exactly what can fail on an uncached/rate-limited
        # fetch, and a save gated on job success would then never persist the
        # schemas it did fetch before failing.
        id: kubeconform-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ksail/kubeconform
          key: kubeconform-schema-cache-v1-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
            kubeconform-schema-cache-v1-${{ github.job }}-

      - name: 🧪 Test
        run: |
          go test ./...

      - name: 📤 Save kubeconform schema cache
        if: "!cancelled() && steps.kubeconform-cache.outputs.cache-hit != 'true'"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ksail/kubeconform
          key: ${{ steps.kubeconform-cache.outputs.cache-primary-key }}

  coverage:
    name: 📊 Code Coverage
    runs-on: ubuntu-latest
    needs: [changes]
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || '.' }}
    # Skip if no Go files changed or on reusable-workflows repo
    if: |
      github.repository != 'devantler-tech/reusable-workflows'
      && needs.changes.outputs.go == 'true'
    permissions:
      contents: write
      # Required by upload-coverage to post coverage to GitHub Code Quality. The CALLING workflow
      # must also grant this (a reusable workflow's token is capped by the caller's grant).
      code-quality: write
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧹 Free disk space
        # Reclaim ~11+ GB by removing large preinstalled toolchains a Go
        # build/test never uses (Android SDK, .NET, GHC, …). A large consumer
        # module's `go build`/`go test ./...` build cache (and the coverage
        # job's `-race` binaries) can otherwise exhaust the runner disk —
        # observed as a hard "No space left on device" failure. Targeted
        # `rm -rf` only (avoids the slow apt-remove path); best-effort.
        run: |
          set -euo pipefail
          before=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/PyPy \
            /usr/local/share/powershell \
            /usr/share/miniconda || true
          after=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "Free disk on /: ${before}G -> ${after}G (gained $((after - before))G)"

      - name: ⚙️ Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.working-directory || '.' }}/go.mod
          cache: true

      - name: 📥 Restore kubeconform schema cache
        # See the identical step in the Test job above for the full rationale
        # (raw.githubusercontent.com 429 rate-limiting, portfolio-wide 2026-07-09;
        # restore/save split so the save can run with if: always()).
        id: kubeconform-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ksail/kubeconform
          key: kubeconform-schema-cache-v1-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
            kubeconform-schema-cache-v1-${{ github.job }}-

      - name: 👨🏻‍🔧 Enable covdata (temp) see https://github.com/golang/go/issues/75031
        run: go env -w GOTOOLCHAIN=go1.26.0+auto

      - name: 📄 Generate coverage
        run: |
          go test -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: 📤 Save kubeconform schema cache
        if: "!cancelled() && steps.kubeconform-cache.outputs.cache-hit != 'true'"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ksail/kubeconform
          key: ${{ steps.kubeconform-cache.outputs.cache-primary-key }}

      # best-effort: coverage reporting is a preview feature and must never block a Go PR. This job
      # runs on every Go PR org-wide via the required-workflow ruleset (pinned to this repo's main).
      - name: 🔄 Convert coverage to Cobertura
        continue-on-error: true
        run: |
          go run github.com/boumenot/gocover-cobertura@v1.5.0 < coverage.txt > coverage.cobertura.xml

      # Self-reference: check out THIS workflow's own repo at the exact commit it is running
      # from (job.workflow_repository / job.workflow_sha), then call the sibling action by
      # local path. Same-commit resolution — no release lag, no tag refs; consumer SHA-pinning
      # policies see only the pinned actions/checkout plus a local `./` path. Placed AFTER
      # `go test ./...` so the extra tree never enters the caller's test scope.
      - name: 📥 Checkout devantler-tech/actions (this workflow's commit)
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devantler-tech-actions
          persist-credentials: false

      # Uploads coverage to GitHub Code Quality (native PR coverage). best-effort: never blocks CI.
      - name: 📊 Upload coverage
        continue-on-error: true
        uses: ./.devantler-tech-actions/upload-coverage
        with:
          file: ${{ inputs.working-directory || '.' }}/coverage.cobertura.xml
          language: Go
          label: code-coverage/go

  # THROWAWAY (proof branch only, never merged): measure which github.* value tells a direct
  # org-required run apart from a workflow_call invocation, so the activation gate is keyed on
  # a measured identity rather than an assumed one (devantler-tech/actions#1075).
  probe-invocation-identity:
    name: 🔬 Probe invocation identity
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Print identity
        env:
          WORKFLOW: ${{ github.workflow }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          JOB_WORKFLOW_SHA: ${{ github.job_workflow_sha }}
          INPUTS_JSON: ${{ toJSON(inputs) }}
          APPLY_INPUT: ${{ inputs.apply-signed-fixes }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "workflow=${WORKFLOW}"
          echo "workflow_ref=${WORKFLOW_REF}"
          echo "workflow_sha=${WORKFLOW_SHA}"
          echo "job_workflow_sha=${JOB_WORKFLOW_SHA}"
          echo "inputs=${INPUTS_JSON}"
          echo "apply-signed-fixes=[${APPLY_INPUT}]"
          echo "event=${EVENT}"
