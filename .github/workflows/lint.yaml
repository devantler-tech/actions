name: 🧹 Lint

# Repo-wide linting with MegaLinter, for consumers that are NOT plain Go modules.
#
# validate-go-project.yaml already embeds a MegaLinter job, but it is one stage of a
# full Go pipeline (tidy, golangci-lint, deadcode, govulncheck, build, test, coverage)
# and scopes MegaLinter to the Go module directory. A repo whose Go code is one subtree
# of a larger tree — a Godot client plus a Go server, say — needs the opposite: lint the
# WHOLE repo, and leave the Go build/test to the consumer's own job. That is this
# workflow.
#
# Flavor: `go`. MegaLinter's flavors differ only in which linters are baked into the
# image, and the `go` flavor's 55 cover every surface this org actually lints — Go, JSON,
# Markdown, YAML, shell, GitHub Actions, Dockerfile, Kubernetes, spelling, secrets and
# copy-paste. `cupcake` adds Python/Terraform/JS at roughly double the image; `all` adds
# far more still. Staying on `go` also means consumers share one warm image layer with
# validate-go-project.yaml. Keep the SHA below in lockstep with that workflow's.
#
# NOTE: `workflow_call` only — deliberately NO `pull_request`/`merge_group` triggers. A
# repo already covered by the org-required validate-go-project.yaml would otherwise run
# MegaLinter twice on every PR.

on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        type: string
        default: ""
        description: "Directory to lint. Empty = the whole repository (the normal case); the CI self-test sets it to a fixture."
      go-version-file:
        required: false
        type: string
        default: ""
        description: "Path to a go.mod. When set, Go is installed before linting so MegaLinter's Go linters run against the module's own toolchain instead of the container's (which lags patched releases). Leave empty when the consumer disables the Go linters or has no Go code."
      apply-fixes:
        required: false
        type: boolean
        default: true
        description: "Auto-fix what the linters can fix and commit the result back to the PR branch. Set false for a read-only gate (and in the self-test, which must never commit to the branch under test)."
      pr-owner:
        required: false
        type: string
        default: ""
        description: "Pull request author login. Auto-fix commits are suppressed for dependency-bot PRs, whose branches are owned by their automation."
    secrets:
      APP_PRIVATE_KEY:
        description: "GitHub App private key. Required only for auto-fix commits; without it the job still lints, but a fixable finding fails the build instead of being committed."
        required: false

# A reusable workflow inherits the CALLER's github.workflow, so keying on it keeps
# separate invocations in separate groups while runs of the same invocation supersede
# (devantler-tech/actions#587).
concurrency:
  group: "lint-${{ github.repository }}-${{ github.ref }}-${{ github.workflow }}"
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: 🧹 Lint - mega-linter
    runs-on: ubuntu-latest
    outputs:
      fixes-created: ${{ steps.fixes.outputs.changed }}
    permissions:
      contents: read
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # Fork pull requests never get secrets, so the App token cannot be minted and fixes
      # can never be committed back. Auto-fixing there would leave changes that the job then
      # fails on — a red check an outside contributor cannot resolve except by installing
      # this image locally. So forks lint READ-ONLY: nothing is fixed, nothing is left
      # uncommitted, nothing fails for a reason they cannot act on.
      #
      # This is not a softer gate. With APPLY_FIXES=none a fixable formatting issue is
      # reported as a warning and MegaLinter exits 0, but real lint ERRORS — invalid JSON,
      # shellcheck failures — still fail the job exactly as they do on a branch.
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Go
        if: ${{ inputs.go-version-file != '' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}

      # Keep this `uses:` in lockstep with validate-go-project.yaml's MegaLinter step
      # (enforced by test-lint-gate-lockstep) so both consumers run the same image and
      # the failure-mode self-test always exercises the real gate.
      - name: 🧹 Lint
        id: ml
        uses: oxsecurity/megalinter/flavors/go@15e5b45552097e318c93de385779ce3b1084052c # v10.0.0
        env:
          DEFAULT_WORKSPACE: ${{ inputs.working-directory || '.' }}
          MEGALINTER_CONFIG: ${{ github.workspace }}/.mega-linter.yml
          VALIDATE_ALL_CODEBASE: true
          APPLY_FIXES: ${{ inputs.apply-fixes && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true && 'all' || 'none' }}
          APPLY_FIXES_EVENT: all
          APPLY_FIXES_MODE: commit
          # actionlint (<=1.7.12, bundled in MegaLinter) doesn't yet know the `code-quality`
          # permission scope that GitHub Code Quality coverage requires callers to grant, so
          # it reports a false "unknown permission scope" error. Ignore it until actionlint
          # catches up.
          ACTION_ACTIONLINT_ARGUMENTS: -ignore code-quality

      # PR-controlled MegaLinter configuration may execute commands. Export only its
      # resulting patch here; write credentials are minted later on a fresh runner.
      - name: 📦 Prepare applied fixes
        if: ${{ inputs.apply-fixes && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true }}
        id: fixes
        shell: bash
        run: |
          git add --intent-to-add .
          if git diff --quiet HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --binary --full-index HEAD > "${RUNNER_TEMP}/megalinter-fixes.patch"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 📤 Upload applied fixes
        if: ${{ steps.fixes.outputs.changed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: megalinter-fixes
          path: ${{ runner.temp }}/megalinter-fixes.patch
          if-no-files-found: error

  apply-fixes:
    name: 🧹 Lint - apply fixes
    needs: lint
    if: |
      inputs.apply-fixes
      && needs.lint.outputs.fixes-created == 'true'
      && github.event.pull_request.head.repo.fork != true
      && github.event_name == 'pull_request'
      && !contains(fromJSON('["dependabot[bot]","dependabot","renovate[bot]","renovatebot","renovate"]'), github.event.pull_request.user.login)
      && !contains(fromJSON('["dependabot[bot]","dependabot","renovate[bot]","renovatebot","renovate"]'), inputs.pr-owner)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: 🔑 Generate GitHub App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      # Check out the PULL REQUEST BRANCH, not the default merge ref. Two things depend on
      # it: the patch must apply to the tree the commit will be based on, and
      # expectedHeadOid below must be that branch's tip. Resolving HEAD from a merge ref
      # would pin the mutation to a commit that exists on no branch.
      #
      # persist-credentials stays false. The commit is created through the GitHub API, so
      # nothing here pushes over git, and leaving a write-scoped token in .git/config would
      # be a standing credential this job has no use for. The token is still passed to
      # `with.token` because the checkout itself has to read the repository.
      - name: 📄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
          token: ${{ steps.generate-token.outputs.token }}

      - name: 📥 Download applied fixes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: megalinter-fixes
          path: ${{ runner.temp }}

      # The patch was produced against the merge ref and is applied here to the branch
      # tip, so it fails when the base has since changed one of the same files. Failing is
      # the correct outcome: the alternative is committing the MERGED content of that file
      # onto the branch, which silently imports base changes into someone's pull request.
      # A rebase resolves it.
      - name: Apply fixes
        shell: bash
        run: |
          set -euo pipefail
          patch="${RUNNER_TEMP}/megalinter-fixes.patch"
          # A replacement run can arrive with these fixes already on the branch: committing
          # raises `synchronize`, and that run checks out github.head_ref, which now contains
          # them. The patch then does not apply, and failing here would skip the signature
          # verification the commit step performs for exactly that case.
          # --reverse --check succeeds only when the patch is present in full, so a base
          # change that touched one of the same files still falls through and fails below.
          if git apply --reverse --check "$patch" 2>/dev/null; then
            echo "Patch is already applied on this branch; nothing to stage."
            exit 0
          fi
          git apply --index "$patch"

      # Commit through the GraphQL API rather than `git commit` + push. Commits created
      # through the API with an App token are signed by GitHub; a CLI commit from a runner
      # is not, and unsigned automation commits are what keep signature enforcement from
      # being extendable past the default branch (devantler-tech/.github#142).
      #
      # Limitation inherited from the API: FileAddition carries a path and its contents and
      # nothing else, so file modes are not expressible. Anything that is not a regular
      # non-executable file is rejected below rather than silently losing its mode or
      # having a symlink dereferenced into an ordinary file.
      - name: 📤 Commit the applied fixes
        shell: bash
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          BRANCH: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
          COMMIT_MESSAGE: "chore: Apply megalinter fixes"
        run: |
          set -euo pipefail

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          additions="$workdir/additions.ndjson"
          deletions="$workdir/deletions.ndjson"
          : >"$additions"
          : >"$deletions"

          # The whole point of using the API is that the commit is signed, so prove it
          # rather than assume it. An unsigned commit here would re-create exactly the
          # condition this step exists to remove, and would do it silently.
          verify_signed() {
            local sha="$1"
            local verified
            verified="$(gh api "repos/${REPO}/commits/${sha}" --jq '.commit.verification.verified')"
            if [ "$verified" != "true" ]; then
              echo "::error::Applied-fixes commit ${sha} is not signed (verified=${verified})."
              exit 1
            fi
            echo "Verified signature on ${sha}."
          }

          # Written to a file rather than read through process substitution: a process
          # substitution's exit status is invisible to both `set -e` and `pipefail`, so a
          # failing `git status` would look exactly like "nothing to commit" and leave the
          # branch silently unfixed with a green build.
          # -uall lists untracked files individually; without it git collapses a new
          # directory into a single "dir/" entry, which is not a file we can encode.
          git status --porcelain -z --no-renames -uall >"$workdir/status"

          while IFS= read -r -d '' entry; do
            entry_status="${entry:0:2}"
            entry_path="${entry:3}"
            [ -n "$entry_path" ] || continue
            case "$entry_status" in
              *D*)
                jq -n --arg p "$entry_path" '{path: $p}' >>"$deletions"
                ;;
              *)
                if [ -L "$entry_path" ] || [ ! -f "$entry_path" ] || [ -x "$entry_path" ]; then
                  echo "::error file=${entry_path}::Applied fix is not a regular non-executable file; the commit API cannot express its mode."
                  exit 1
                fi
                # File content must never reach argv. Linux caps a single argv entry at
                # MAX_ARG_STRLEN (128 KiB) independently of ARG_MAX, and a formatter can
                # rewrite files far larger than that. --rawfile reads from disk instead,
                # and base64 output is ASCII so binary inputs survive the round trip.
                base64 -w0 <"$entry_path" >"$workdir/content.b64"
                jq -n --arg p "$entry_path" --rawfile c "$workdir/content.b64" \
                  '{path: $p, contents: ($c | gsub("\\s"; ""))}' >>"$additions"
                ;;
            esac
          done <"$workdir/status"

          if [ ! -s "$additions" ] && [ ! -s "$deletions" ]; then
            echo "No applied fixes left to commit."
            # Committing raises `synchronize` on the pull request. That new run shares this
            # workflow's concurrency group with cancel-in-progress, so it can cancel the
            # committing run before it verifies. The replacement run lands here with the
            # work already done — so verify the head rather than exiting blind, or a signing
            # regression escapes unreported.
            if [ "$(git log -1 --format=%s)" = "${COMMIT_MESSAGE}" ]; then
              echo "Head is an applied-fixes commit; verifying it here in case the run that created it was cancelled."
              verify_signed "$(git rev-parse HEAD)"
            fi
            exit 0
          fi

          # --slurpfile keeps the aggregate off argv too: the combined payload is bounded by
          # total changed content, which can exceed the same 128 KiB cap.
          jq -n \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg message "$COMMIT_MESSAGE" \
            --arg oid "$(git rev-parse HEAD)" \
            --slurpfile additions "$additions" \
            --slurpfile deletions "$deletions" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {
                input: {
                  branch: {
                    repositoryNameWithOwner: $repo,
                    branchName: $branch
                  },
                  message: { headline: $message },
                  expectedHeadOid: $oid,
                  fileChanges: { additions: $additions, deletions: $deletions }
                }
              }
            }' >"$workdir/mutation.json"

          # `gh api graphql` exits non-zero on a GraphQL error, so the assignment itself
          # would abort under `set -e` and skip these diagnostics. Handle the failure inline
          # so the operator gets a labelled annotation instead of one stderr line.
          if ! response="$(gh api graphql --input "$workdir/mutation.json" 2>"$workdir/stderr")"; then
            echo "::error::createCommitOnBranch failed"
            cat "$workdir/stderr" >&2
            jq '.errors // .' <<<"$response" 2>/dev/null || printf '%s\n' "$response"
            exit 1
          fi
          # Capture first, then assert with a builtin. `jq -e` as the if-condition cannot
          # distinguish "the filter was false" (exit 1) from "jq itself failed" (exit 4 on
          # empty input, 5 on malformed), so a truncated or non-JSON response would take the
          # no-errors path and continue.
          errors="$(jq -c '.errors // empty' <<<"$response")"
          if [ -n "$errors" ]; then
            echo "::error::createCommitOnBranch failed"
            printf '%s\n' "$errors"
            exit 1
          fi

          oid="$(jq -r '.data.createCommitOnBranch.commit.oid // empty' <<<"$response")"
          if [ -z "$oid" ]; then
            echo "::error::createCommitOnBranch returned no commit oid"
            printf '%s\n' "$response"
            exit 1
          fi
          echo "Committed applied linter fixes as ${oid}."
          verify_signed "$oid"
