# FIXTURE — deliberately BAD input for test-govulncheck-main-coverage.sh.
# Not a real workflow: it lives outside .github/workflows/ so no gate scans it.
name: fixture
on: workflow_call
jobs:
  changes:
    runs-on: ubuntu-latest
    steps:
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
  govulncheck:
    needs: [changes]
    runs-on: ubuntu-latest
    if: |
      github.repository != 'x/y'
      && (needs.changes.outputs.go == 'true'
      || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    steps:
      - run: 'true'
