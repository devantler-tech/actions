# Defect: allow-file is a bare root-relative literal, so a nested module's allowlist triggers the scan but is not the file the scanner reads.
name: fixture
on:
  workflow_call:
    inputs:
      scan-default-branch:
        required: false
        type: boolean
        default: false
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      govulncheck: ${{ steps.filter.outputs.govulncheck }}
    steps:
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            go:
              - '**/*.go'
            govulncheck:
              - '.govulncheck-allow.txt'
              - '**/.govulncheck-allow.txt'
  govulncheck:
